name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install the checkers
        run: python -m pip install -r scripts/requirements.txt
      - name: Manifests are fresh (conformance and stress)
        run: python scripts/generate_manifest.py --check
      - name: words.yaml matches the schema
        run: python scripts/check_words_schema.py
      - name: grammar.xml matches the DTD
        run: python scripts/check_dtd.py
      - name: docs/grammars.md and stress/README.md list every fixture
        run: python scripts/check_grammars_md.py
      - name: FieldWorks witnesses are well formed
        run: python scripts/check_fwdata.py
      - name: Constructs, coverage and words agree
        run: python parity-check.py
      - name: Calibration families are well formed
        run: python scripts/check_calibration.py
      - name: Relative links resolve
        run: python scripts/check_links.py
      - name: No private paths, emails or user names
        env:
          # Optional repository variable: comma-separated literal terms that must never appear.
          PRIVACY_LINT_EXTRA: ${{ vars.PRIVACY_LINT_EXTRA }}
        run: python scripts/privacy_lint.py
