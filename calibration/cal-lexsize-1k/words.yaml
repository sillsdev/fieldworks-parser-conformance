# kind: calibration (CALIBRATION ONLY: never run in conformance or engine test runs; see calibration/README.md)
# Lexicon-size ladder: 1000 roots under the same 12 suffix rules and the same 16 words in every size.
# Generated by scripts/calib_a_gen.py (lexsize). The oracle's analyses for each word are identical in all four sizes.
# Each parse's signature is the oracle's. The rules: and gloss: fields are NOT oracle output: the generator
# derives them from the signature (morpheme id -> rule id); the hc-conformance self-check compares the rules
# against the oracle trace.
# oracle-provenance: Oracle: hc.dll, Machine aab4c598 (batch command, MaxRoots 2).
language: CalLexSize1k
inspired_by: ["synthetic cost-calibration grammar"]
sources:
  - "PanGloss #240 parser-work cost-weight calibration"
requires: []
fieldworks_producible: true
budget_ms: 600000
words:
  - word: "keridodo"
    note: "keri+l1_1+l3_2. Same word and same analyses in all four lexicon sizes; measured cost is in ladder.tsv."
    parses:
      - signature: "R879+L0_2+L1_1|keridodo"
        gloss: "R879-L0_2-L1_1"
        rules: [l0_2, l1_1]
        exercises: []
      - signature: "R879+L0_2+L2_2|keridodo"
        gloss: "R879-L0_2-L2_2"
        rules: [l0_2, l2_2]
        exercises: []
      - signature: "R879+L0_2+L3_2|keridodo"
        gloss: "R879-L0_2-L3_2"
        rules: [l0_2, l3_2]
        exercises: []
      - signature: "R879+L1_1+L2_2|keridodo"
        gloss: "R879-L1_1-L2_2"
        rules: [l1_1, l2_2]
        exercises: []
      - signature: "R879+L1_1+L3_2|keridodo"
        gloss: "R879-L1_1-L3_2"
        rules: [l1_1, l3_2]
        exercises: []
      - signature: "R879+L2_2+L3_2|keridodo"
        gloss: "R879-L2_2-L3_2"
        rules: [l2_2, l3_2]
        exercises: []
