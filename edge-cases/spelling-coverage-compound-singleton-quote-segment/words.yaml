# oracle-provenance: founding-oracle Machine e63b8863d37d3189c2b11fcaf9d43be74962ad70 (hc-conformance self-check, --propose; every signature is what C# returned on 2026-11-19, none taken from PanGloss staging)
language: SpellingCompoundSingletonQuoteSegment
requires: [morpher-settings]
morpher:
  MaxRoots: 2
fieldworks_producible: true
words:
  - word: a
    note: "C# returns 1 analysis (X|a): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X|a"
        rules: []
  - word: "a\""
    note: "C# returns 3 analyses (W|a[p\"]; X+Y|a+?[p\"]): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "W|a[p\"]"
        rules: []
      - signature: "X+Y|a+?[p\"]"
        rules: ["cr1"]
        exercises:
          - "CompoundingRule"
      - signature: "X+Y|a+?[p\"]"
        rules: ["cr2"]
        exercises:
          - "CompoundingRule"
  - word: "pa\""
    note: "C# returns 2 analyses (Y+W|[p\"]+?a[p\"]): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "Y+W|[p\"]+?a[p\"]"
        rules: ["cr1"]
        exercises:
          - "CompoundingRule"
      - signature: "Y+W|[p\"]+?a[p\"]"
        rules: ["cr2"]
        exercises:
          - "CompoundingRule"
  - word: "a\"+p"
    note: "C# returns 2 analyses (W+Y|a[p\"]+?[p\"]): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "W+Y|a[p\"]+?[p\"]"
        rules: ["cr1"]
        exercises:
          - "CompoundingRule"
      - signature: "W+Y|a[p\"]+?[p\"]"
        rules: ["cr2"]
        exercises:
          - "CompoundingRule"
  - word: "s\"a"
    note: "C# returns 1 analysis (PRE+X|s[p\"]a): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "PRE+X|s[p\"]a"
        rules: ["PRE"]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
  - word: "as\"p"
    note: "C# returns 1 analysis (X+PRE+Y|a+?s[p\"][p\"]): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+PRE+Y|a+?s[p\"][p\"]"
        rules: ["PRE", "cr2"]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
          - "CompoundingRule"
  - word: "s\"s\"s\"a"
    note: "C# finds no analysis: pins that this spelling is not a route of the grammar."
    expect_fail: true
  - word: "a\"aa"
    note: "C# finds no analysis: pins that this spelling is not a route of the grammar."
    expect_fail: true
