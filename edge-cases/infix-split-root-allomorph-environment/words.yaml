# because that build gives it no parse.
# History: the rows were first taken with the fix in sillsdev/machine#631, where ginabas parses as gabas + infix.
# #631 was closed unmerged and sillsdev/machine#630 is still open, so the reference has no such fix and ginabas has no
# parse. ginabas is pinned to that outcome; status.yaml records the intended answer. When #630 is fixed upstream and
# the reference commit includes it, flip ginabas to the intended parse and delete its status.yaml row.
language: InfixSplitRootAllomorphEnvironment
inspired_by: ["synthetic allomorph environment and infixation probe (not modeling any real language)"]
sources:
  - "sillsdev/machine issue 630: Allomorph.IsWordValid tested environments once per root piece"
requires: []
words:
  - word: gabsa
    note: >-
      Suffix a follows the root, so gabs / _ V applies and the root parses as gabs plus the suffix.
    parses:
      - signature: "ROOT+SFX|gabsa"
        rules: [mrSuffix]
        exercises: ["AffixProcessRule: prefix/suffix/circumfix/infix"]
  - word: gabas
    note: >-
      Word-final root: gabs / _ V does not apply, so the elsewhere form gabas parses.
    parses:
      - signature: "ROOT|gabas"
        rules: []
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
  - word: ginabas
    note: >-
      The infix splits gabas into g and abas; the infix's i follows the first piece but is not the root's right context,
      and the root is word-final, so gabs / _ V does not apply and should not block gabas. The reference tests the
      allomorph environment at each piece, counts gabs as applicable, and so gives no parse. status.yaml records the
      intended answer.
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
  - word: ginabsa
    note: >-
      The infix splits gabs into g and abs; the suffix a follows the last piece, so gabs / _ V holds and the root parses as gabs. Two rule orders (infix then suffix, suffix then infix) give the same surface.
    parses:
      - signature: "ROOT+INF+SFX|ginabsa"
        rules: [mrInfix, mrSuffix]
      - signature: "ROOT+INF+SFX|ginabsa"
        rules: [mrSuffix, mrInfix]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
  - word: ginabs
    note: >-
      Rejection: gabs is word-final with the infix inside it, so gabs / _ V does not hold at the last piece and no other form fits.
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
  - word: gabs
    note: >-
      Rejection: gabs / _ V needs a vowel after the root.
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
  - word: gabasa
    note: >-
      Rejection: a vowel follows the root, so gabs / _ V applies and blocks the elsewhere form gabas; gabs does not spell this word.
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
  - word: ginabasa
    note: >-
      Rejection: as gabasa with the infix inside the root; a vowel follows the last piece, so gabs / _ V blocks gabas.
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
