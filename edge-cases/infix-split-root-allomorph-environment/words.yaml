# oracle-provenance: founding-oracle machine-source=4d9b454d (hc-conformance self-check); the ginabas row is expect_fail
# because that build gives it no parse.
# History: the rows were first taken with the fix in sillsdev/machine#631 (commit 7e5d5a64), where ginabas parses as
# gabas + infix. #631 was CLOSED UNMERGED on 2026-11-12 and sillsdev/machine#630 is still open, so the oracle at
# 4d9b454d has no such fix and ginabas has no parse there. ginabas is pinned to that outcome and its note records
# the intended behaviour. When #630 is fixed upstream and a pin includes it, flip ginabas back to the parse below.
language: InfixSplitRootAllomorphEnvironment
inspired_by: ["synthetic allomorph environment and infixation probe (not modeling any real language)"]
sources:
  - "sillsdev/machine issue 630: Allomorph.IsWordValid tested environments once per root piece"
requires: []
fieldworks_producible: true
words:
  - word: gabsa
    note: >-
      Suffix a follows the root, so gabs / _ V applies and the root parses as gabs plus the suffix.
    parses:
      - signature: "ROOT+SFX|gabsa"
        rules: [mrSuffix]
  - word: gabas
    note: >-
      Word-final root: gabs / _ V does not apply, so the elsewhere form gabas parses.
    parses:
      - signature: "ROOT|gabas"
        rules: []
  - word: ginabas
    note: >-
      Known oracle limitation (sillsdev/machine#630, open; the fix in #631 was closed unmerged). The infix splits gabas
      into g and abas; the infix's i follows the first piece but is not the root's right context, and the root is
      word-final, so gabs / _ V does not apply and should not block gabas. The oracle at 4d9b454d tests the allomorph
      environment at each piece, counts gabs as applicable, and so no parse results. Intended parse once #630 is
      fixed: ROOT+INF|ginabas with rule mrInfix.
    expect_fail: true
  - word: ginabsa
    note: >-
      The infix splits gabs into g and abs; the suffix a follows the last piece, so gabs / _ V holds and the root parses as gabs. Two rule orders (infix then suffix, suffix then infix) give the same surface.
    parses:
      - signature: "ROOT+INF+SFX|ginabsa"
        rules: [mrInfix, mrSuffix]
      - signature: "ROOT+INF+SFX|ginabsa"
        rules: [mrSuffix, mrInfix]
  - word: ginabs
    note: >-
      Rejection: gabs is word-final with the infix inside it, so gabs / _ V does not hold at the last piece and no other form fits.
    expect_fail: true
  - word: gabs
    note: >-
      Rejection: gabs / _ V needs a vowel after the root.
    expect_fail: true
  - word: gabasa
    note: >-
      Rejection: a vowel follows the root, so gabs / _ V applies and blocks the elsewhere form gabas; gabs does not spell this word.
    expect_fail: true
  - word: ginabasa
    note: >-
      Rejection: as gabasa with the infix inside the root; a vowel follows the last piece, so gabs / _ V blocks gabas.
    expect_fail: true
