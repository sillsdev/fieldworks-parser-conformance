# oracle-provenance: founding-oracle machine-commit=ba6dfa10 verified-date=2026-11-26 (every row from the C# self-check at that pin, hc-conformance --propose; none from PanGloss; staged by PanGloss#388; the grammar is the issue's probe, kept whole, and every staged row replayed unchanged). The three expect_fail rows record that ba6dfa10 gives no parse for words its own synthesis generates.
# Reference defect sillsdev/machine#619 (open; divergence 127; tracked in status.yaml): AnalysisMetathesisRuleSpec drops everything between the
# switch groups, so analysis of pr0 (s p t -> t p s) looks for adjacent switches and cannot undo the swap. Checked
# against the #619 fix (293f6f8d applied to ba6dfa10): tps, tp+s and t+ps then parse as R0+PR0+PR1 and R2+PR0+PR1, and
# the control st is unchanged. Without the deletion pd0 the three words are still rejected, so pd0 is not what fails.
# When #619 is fixed and the reference commit includes it, flip the three rows to the intended answers in status.yaml and delete their status.yaml rows.
language: MetathesisMiddleContextEmptiedEdges
inspired_by: ["synthetic metathesis rule with a middle segment and a deletion (not modeling any real language)"]
sources: ["sillsdev/PanGloss#388", "sillsdev/machine#619", "FieldWorks HCLoader.LoadMetathesisRule (switches and middle context), HCLoader.LoadRewriteRule (a -> 0), HCLoader.LoadAffixProcessRule (prefixes s+, p+)"]
requires: [phonology]
words:
  - word: tps
    note: >-
      Rule pr0 is `s p t -> t p s`, with the middle `p` between the switches; prefixes PR0 `s+` and PR1 `p+` on root t make `s+p+t`, which pr0 turns into `t+p+s` (shown as tps). Analysis drops the middle context and cannot undo the swap. The reference gives no parse; status.yaml records the intended answer.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: "tp+s"
    note: >-
      As tps with a boundary after the middle segment. The reference gives no parse; status.yaml records the intended answer.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: "t+ps"
    note: >-
      As tps with a boundary after the first switch. The reference gives no parse; status.yaml records the intended answer.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: st
    note: >-
      Control: the switches are adjacent in the surface form with no middle segment, so pr0 does not apply and the C# engine agrees with a correct one. R1 is the root `st`; PR0+R0 and PR0+R2 are prefix s+ before root t (R2 `at` loses its a to pd0). The #619 fix leaves this row unchanged.
    parses:
      - signature: "PR0+R0|s+?t"
        rules: [PR0, pd0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
      - signature: "PR0+R2|s+?t"
        rules: [PR0, pd0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
      - signature: "R1|st"
        rules: [pd0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
  - word: "p+t"
    note: >-
      Control for the prefix PR1 alone: `p+` before root t (or before `at`, which loses its a to pd0). There is no `s` in the word, so pr0 does not apply and both engines agree.
    parses:
      - signature: "PR1+R0|p+?t"
        rules: [PR1, pd0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
      - signature: "PR1+R2|p+?t"
        rules: [PR1, pd0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
