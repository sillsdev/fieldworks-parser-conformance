# oracle-provenance: founding-oracle Machine 1ddef2bd2f1503717de95556116df8e4a63846d6 (hc-conformance self-check, --propose; every signature is what C# returned on 2026-11-19, none taken from PanGloss staging)
language: FeaturelessSegmentClassRewrite
requires: [phonology]
fieldworks_producible: true
fieldworks_producible_notes: >-
  Copied from the existing featureless-segment-class-rewrite fixture. The target
  is a literal segment or a singleton segment class; ordinary phonological-rule
  target and class-output shapes remain expressible by FieldWorks. No fwdata
  round-trip witness is claimed.
words:
  - word: asa
    note: First output class spelling, unchanged AKA derivation.
    parses:
      - signature: "AKA|a[sz]a"
        rules: [prLen]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
  - word: aza
    note: Second output class spelling, unchanged AKA derivation.
    parses:
      - signature: "AKA|a[sz]a"
        rules: [prLen]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
  - word: aka
    note: Obligatory rewrite prevents the unchanged root from surfacing.
    expect_fail: true
