language: BoundaryFirstInNarrowingLhsStrrep
inspired_by:
  - synthetic boundary-in-target post-nasal probe (not modeling any real language)
sources:
  - src/SIL.Machine.Morphology.HermitCrab/PhonologicalRules/NarrowAnalysisRewriteRuleSpec.cs
  - src/SIL.Machine.Morphology.HermitCrab/CharacterDefinitionTable.cs
requires:
  - phonology
words:
  - word: kanmo
    note: '[cell first-strrep] KAN+BO (kan+bo -> kanmo, boundary absorbed, so no boundary survives in the shape) and KAN+MO (kan+mo, no rule, the boundary survives as an optional marker in the rendered shape). KAN+BO is the witness.'
    parses:
      - signature: KAN_first-strrep+BO_first-strrep|kanmo
        rules:
          - mrSfxBo_first-strrep
          - prPostNasal_first-strrep
      - signature: KAN_first-strrep+MO_first-strrep|kan+?mo
        rules:
          - mrSfxMo_first-strrep
          - prPostNasal_first-strrep
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: kanbo
    note: '[cell first-strrep] The rule is obligatory after a nasal, so kan+bo never surfaces unchanged.'
    expect_fail: true
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: katbo
    note: '[cell first-strrep] No nasal before the boundary, so the rule does not apply.'
    parses:
      - signature: KAT_first-strrep+BO_first-strrep|kat+?bo
        rules:
          - mrSfxBo_first-strrep
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: katmo
    note: '[cell first-strrep] Underlying suffix m after a non-nasal.'
    parses:
      - signature: KAT_first-strrep+MO_first-strrep|kat+?mo
        rules:
          - mrSfxMo_first-strrep
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: kan
    note: '[cell first-strrep] Bare root.'
    parses:
      - signature: KAN_first-strrep|kan
        rules: []
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: kat
    note: '[cell first-strrep] Bare root.'
    parses:
      - signature: KAT_first-strrep|kat
        rules: []
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: gdhl
    note: '[cell leftover-strrep] KAN+BO (kan+bo -> kamo, nasal and boundary absorbed) and KA+MO (ka+mo, no rule).'
    parses:
      - signature: KA_leftover-strrep+MO_leftover-strrep|gd+?hl
        rules:
          - mrSfxMo_leftover-strrep
          - prPostNasal_leftover-strrep
      - signature: KAN_leftover-strrep+BO_leftover-strrep|gdhl
        rules:
          - mrSfxBo_leftover-strrep
          - prPostNasal_leftover-strrep
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: gdjfl
    note: '[cell leftover-strrep] The rule is obligatory, so kan+bo never surfaces unchanged.'
    expect_fail: true
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: gdjhl
    note: '[cell leftover-strrep] Only KAN+MO; a KAN+BO reading would have lost the n.'
    parses:
      - signature: KAN_leftover-strrep+MO_leftover-strrep|gdj+?hl
        rules:
          - mrSfxMo_leftover-strrep
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: gdpfl
    note: '[cell leftover-strrep] No nasal before the boundary, so the rule does not apply.'
    parses:
      - signature: KAT_leftover-strrep+BO_leftover-strrep|gdp+?fl
        rules:
          - mrSfxBo_leftover-strrep
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: gdphl
    note: '[cell leftover-strrep] Underlying suffix m after a non-nasal.'
    parses:
      - signature: KAT_leftover-strrep+MO_leftover-strrep|gdp+?hl
        rules:
          - mrSfxMo_leftover-strrep
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: gdj
    note: '[cell leftover-strrep] Bare root.'
    parses:
      - signature: KAN_leftover-strrep|gdj
        rules: []
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: gdp
    note: '[cell leftover-strrep] Bare root.'
    parses:
      - signature: KAT_leftover-strrep|gdp
        rules: []
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
  - word: gd
    note: '[cell leftover-strrep] Bare root.'
    parses:
      - signature: KA_leftover-strrep|gd
        rules: []
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side
