language: MergeSubrulesPosTemplate
inspired_by:
  - synthetic part-of-speech-gated syllabary merge (not modeling any real language)
sources:
  - src/SIL.Machine.Morphology.HermitCrab/PhonologicalRules/NarrowAnalysisRewriteRuleSpec.cs
  - src/SIL.Machine.Morphology.HermitCrab/PhonologicalRules/AnalysisRewriteRule.cs
requires:
  - phonology
words:
  - word: F
    note: '[cell ltr] The noun TA_N fused by the noun subrule.'
    parses:
      - signature: TA_N_ltr|F
        rules:
          - prMerge_ltr
    exercises:
      - 'RewriteSubruleDef gating: required/excluded POS or MPR at the subrule level'
  - word: Gs
    note: '[cell ltr] The verb TA_V with the mandatory template suffix, fused by the verb subrule.'
    parses:
      - signature: TA_V_ltr+S_ltr|Gs
        rules:
          - mrSfxS_ltr
          - prMerge_ltr
    exercises:
      - 'RewriteRule direction (Dir): left-to-right'
  - word: FF
    note: '[cell ltr] TATA fused at both sites (left to right scan).'
    parses:
      - signature: TATA_ltr|FF
        rules:
          - prMerge_ltr
    exercises:
      - 'RewriteSubruleDef gating: required/excluded POS or MPR at the subrule level'
  - word: G
    note: '[cell ltr] A verb without its mandatory template suffix is not a word, and no noun fuses to G.'
    expect_fail: true
    exercises:
      - Affix template slots (obligatory/disjunctive/ordering)
  - word: Fs
    note: '[cell ltr] The suffix is verb-only and reachable only through the verb template; no verb fuses to F.'
    expect_fail: true
    exercises:
      - Affix template slots (obligatory/disjunctive/ordering)
  - word: ta
    note: '[cell ltr] The merge is obligatory for both parts of speech.'
    expect_fail: true
    exercises:
      - 'RewriteSubruleDef gating: required/excluded POS or MPR at the subrule level'
  - word: tas
    note: '[cell ltr] Same, under the suffix.'
    expect_fail: true
    exercises:
      - 'RewriteSubruleDef gating: required/excluded POS or MPR at the subrule level'
  - word: tata
    note: '[cell ltr] Same, two sites.'
    expect_fail: true
    exercises:
      - 'RewriteSubruleDef gating: required/excluded POS or MPR at the subrule level'
  - word: H
