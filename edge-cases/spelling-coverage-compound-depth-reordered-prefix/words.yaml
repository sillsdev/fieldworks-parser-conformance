language: SpellingCompoundDepthReorderedPrefix
requires: [morpher-settings]
morpher:
  MaxRoots: 3
words:
  - word: spat
    note: "C# returns 1 analysis (PRE+Y+X+Z|sp[aá][+-=]?[+-=]?t): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "PRE+Y+X+Z|sp[aá][+-=]?[+-=]?t"
        rules: ["PRE", "cr1", "cr2"]
    exercises:
      - "CompoundingRule > depth limit"
  - word: sap
    note: "C# returns 2 analyses (PRE+X+Y|s[aá]p[+-=]?): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "PRE+X+Y|s[aá]p[+-=]?"
        rules: ["PRE", "cr1"]
      - signature: "PRE+X+Y|s[aá]p[+-=]?"
        rules: ["PRE", "cr2"]
    exercises:
      - "CompoundingRule > depth limit"
  - word: apt
    note: "C# returns 2 analyses (X+Y+Z|[aá][+-=]?p[+-=]?t): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+Y+Z|[aá][+-=]?p[+-=]?t"
        rules: ["cr1", "cr2"]
      - signature: "X+Y+Z|[aá][+-=]?p[+-=]?t"
        rules: ["cr1", "cr2"]
    exercises:
      - "CompoundingRule > depth limit"
  - word: stpa
    note: "C# returns 1 analysis (PRE+Z+Y+X|stp[+-=]?[+-=]?[aá]): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "PRE+Z+Y+X|stp[+-=]?[+-=]?[aá]"
        rules: ["PRE", "cr1", "cr2"]
    exercises:
      - "CompoundingRule > depth limit"
  - word: psat
    note: "C# returns 1 analysis (Y+PRE+X+Z|p[+-=]?s[aá]t[+-=]?): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "Y+PRE+X+Z|p[+-=]?s[aá]t[+-=]?"
        rules: ["PRE", "cr1", "cr2"]
    exercises:
      - "CompoundingRule > depth limit"
  - word: aspt
    note: "C# returns 1 analysis (X+PRE+Y+Z|[aá][+-=]?spt[+-=]?): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+PRE+Y+Z|[aá][+-=]?spt[+-=]?"
        rules: ["PRE", "cr1", "cr2"]
    exercises:
      - "CompoundingRule > depth limit"
