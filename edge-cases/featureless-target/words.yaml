language: FeaturelessTarget
requires:
  - phonology
fieldworks_producible_notes: Copied from the existing featureless-segment-class-rewrite fixture. The target is a literal segment or a singleton segment class; ordinary phonological-rule target and class-output shapes remain expressible by FieldWorks. No fwdata round-trip witness is claimed.
words:
  - word: asa
    note: '[cell literal] First output class spelling, unchanged AKA derivation.'
    parses:
      - signature: AKA_literal|a[sz]a
        rules:
          - prLen_literal
        exercises:
          - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)
  - word: aza
    note: '[cell literal] Second output class spelling, unchanged AKA derivation.'
    parses:
      - signature: AKA_literal|a[sz]a
        rules:
          - prLen_literal
        exercises:
          - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)
  - word: aka
    note: '[cell literal] Obligatory rewrite prevents the unchanged root from surfacing.'
    expect_fail: true
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)
  - word: ege
    note: '[cell singleton] First output class spelling, unchanged AKA derivation.'
    parses:
      - signature: AKA_singleton|e[gf]e
        rules:
          - prLen_singleton
        exercises:
          - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)
  - word: efe
    note: '[cell singleton] Second output class spelling, unchanged AKA derivation.'
    parses:
      - signature: AKA_singleton|e[gf]e
        rules:
          - prLen_singleton
        exercises:
          - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)
  - word: eue
    note: '[cell singleton] Obligatory rewrite prevents the unchanged root from surfacing.'
    expect_fail: true
    exercises:
      - RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)
