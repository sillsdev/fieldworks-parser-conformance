language: SpellingCompoundSingletonMergingMark
requires: [morpher-settings]
morpher:
  MaxRoots: 2
words:
  - word: "́p"
    note: "C# returns 1 analysis (W|́p): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "W|́p"
        rules: []
    exercises:
      - "CompoundingRule"
  - word: "áp"
    note: "C# returns 2 analyses (X+W|áp): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+W|áp"
        rules: ["cr1"]
        exercises:
          - "CompoundingRule"
      - signature: "X+W|áp"
        rules: ["cr2"]
        exercises:
          - "CompoundingRule"
  - word: "́pa"
    note: "C# returns 2 analyses (W+X|́pa): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "W+X|́pa"
        rules: ["cr1"]
        exercises:
          - "CompoundingRule"
      - signature: "W+X|́pa"
        rules: ["cr2"]
        exercises:
          - "CompoundingRule"
  - word: "ápa"
    note: "C# finds no analysis: pins that this spelling is not a route of the grammar."
    expect_fail: true
    exercises:
      - "CompoundingRule"
  - word: sa
    note: "C# returns 1 analysis (PRE+X|sa): pins that this word has a route and its morpheme sequence."
    parses:
      - signature: "PRE+X|sa"
        rules: ["PRE"]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"