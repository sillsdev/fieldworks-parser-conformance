  - word: fgdb
    note: '[cell reordered-prefix] C# returns 1 analysis (PRE+Z+Y+X|stp[+-=]?[+-=]?[aá]): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: PRE_reordered-prefix+Z_reordered-prefix+Y_reordered-prefix+X_reordered-prefix|fgd[+-=]?[+-=]?[bh]
        rules:
          - PRE_reordered-prefix
          - cr1_reordered-prefix
          - cr2_reordered-prefix
    exercises:
