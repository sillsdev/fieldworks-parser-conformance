  - word: bfdg
    note: '[cell reordered-prefix] C# returns 1 analysis (X+PRE+Y+Z|[aá][+-=]?spt[+-=]?): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_reordered-prefix+PRE_reordered-prefix+Y_reordered-prefix+Z_reordered-prefix|[bh][+-=]?fdg[+-=]?
