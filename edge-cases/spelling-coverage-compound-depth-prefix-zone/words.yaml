        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
  - word: apst
    note: "C# returns 3 analyses (X+Y+PRE+Z|[aá][+-=]?ps[+-=]?t): pins that this spelling is a route and its morpheme sequence."
