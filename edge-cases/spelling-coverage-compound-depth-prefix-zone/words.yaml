language: SpellingCompoundDepthPrefixZone
requires:
  - morpher-settings
morpher:
  MaxRoots: 3
words:
  - word: as
    note: '[cell prefix-zone] C# returns 1 analysis (X+PRE|[aá]s): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_prefix-zone+PRE_prefix-zone|[aá]s
        rules:
          - PRE_prefix-zone
        exercises:
          - 'AffixProcessRule: prefix/suffix/circumfix/infix'
  - word: sa
    note: '[cell prefix-zone] C# returns 1 analysis (PRE+X|s[aá]): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: PRE_prefix-zone+X_prefix-zone|s[aá]
        rules:
          - PRE_prefix-zone
        exercises:
          - 'AffixProcessRule: prefix/suffix/circumfix/infix'
  - word: apst
    note: '[cell prefix-zone] C# returns 3 analyses (X+Y+PRE+Z|[aá][+-=]?ps[+-=]?t): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_prefix-zone+Y_prefix-zone+PRE_prefix-zone+Z_prefix-zone|[aá][+-=]?ps[+-=]?t
        rules:
          - PRE_prefix-zone
          - cr1_prefix-zone
          - cr2_prefix-zone
      - signature: X_prefix-zone+Y_prefix-zone+PRE_prefix-zone+Z_prefix-zone|[aá][+-=]?ps[+-=]?t
        rules:
          - PRE_prefix-zone
          - cr1_prefix-zone
          - cr2_prefix-zone
      - signature: X_prefix-zone+Y_prefix-zone+PRE_prefix-zone+Z_prefix-zone|[aá][+-=]?ps[+-=]?t
        rules:
          - PRE_prefix-zone
          - cr1_prefix-zone
          - cr2_prefix-zone
    exercises:
      - CompoundingRule > depth limit
  - word: aspt
    note: '[cell prefix-zone] C# returns 3 analyses (X+PRE+Y+Z|[aá][+-=]?sp[+-=]?t): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_prefix-zone+PRE_prefix-zone+Y_prefix-zone+Z_prefix-zone|[aá][+-=]?sp[+-=]?t
        rules:
          - PRE_prefix-zone
          - cr1_prefix-zone
          - cr2_prefix-zone
      - signature: X_prefix-zone+PRE_prefix-zone+Y_prefix-zone+Z_prefix-zone|[aá][+-=]?sp[+-=]?t
        rules:
          - PRE_prefix-zone
          - cr1_prefix-zone
          - cr2_prefix-zone
      - signature: X_prefix-zone+PRE_prefix-zone+Y_prefix-zone+Z_prefix-zone|[aá][+-=]?sp[+-=]?t
        rules:
          - PRE_prefix-zone
          - cr1_prefix-zone
          - cr2_prefix-zone
    exercises:
      - CompoundingRule > depth limit
  - word: apt
    note: '[cell prefix-zone] C# returns 2 analyses (X+Y+Z|[aá][+-=]?p[+-=]?t): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_prefix-zone+Y_prefix-zone+Z_prefix-zone|[aá][+-=]?p[+-=]?t
        rules:
          - cr1_prefix-zone
          - cr2_prefix-zone
      - signature: X_prefix-zone+Y_prefix-zone+Z_prefix-zone|[aá][+-=]?p[+-=]?t
        rules:
          - cr1_prefix-zone
          - cr2_prefix-zone
    exercises:
      - CompoundingRule > depth limit
  - word: sap
    note: '[cell prefix-zone] C# returns 3 analyses (PRE+X+Y|s[aá][+-=]?p): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: PRE_prefix-zone+X_prefix-zone+Y_prefix-zone|s[aá][+-=]?p
        rules:
          - PRE_prefix-zone
          - cr1_prefix-zone
      - signature: PRE_prefix-zone+X_prefix-zone+Y_prefix-zone|s[aá][+-=]?p
        rules:
          - PRE_prefix-zone
          - cr1_prefix-zone
      - signature: PRE_prefix-zone+X_prefix-zone+Y_prefix-zone|s[aá][+-=]?p
        rules:
          - PRE_prefix-zone
          - cr2_prefix-zone
    exercises:
      - CompoundingRule > depth limit
  - word: fdbg
    note: '[cell reordered-prefix] C# returns 1 analysis (PRE+Y+X+Z|sp[aá][+-=]?[+-=]?t): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: PRE_reordered-prefix+Y_reordered-prefix+X_reordered-prefix+Z_reordered-prefix|fd[bh][+-=]?[+-=]?g
        rules:
          - PRE_reordered-prefix
          - cr1_reordered-prefix
          - cr2_reordered-prefix
    exercises:
