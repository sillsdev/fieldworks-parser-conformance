  - word: bdg
    note: '[cell reordered-prefix] C# returns 2 analyses (X+Y+Z|[aá][+-=]?p[+-=]?t): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_reordered-prefix+Y_reordered-prefix+Z_reordered-prefix|[bh][+-=]?d[+-=]?g
