# oracle-provenance: founding-oracle Machine 1ddef2bd2f1503717de95556116df8e4a63846d6 (hc-conformance self-check, --propose; every signature is what C# returned on 2026-11-19, none taken from PanGloss staging)
language: SpellingCompoundDepthPrefixZone
requires: [morpher-settings]
morpher:
  MaxRoots: 3
fieldworks_producible: true
words:
  - word: as
    note: "C# returns 1 analysis (X+PRE|[aá]s): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+PRE|[aá]s"
        rules: ["PRE"]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
  - word: sa
    note: "C# returns 1 analysis (PRE+X|s[aá]): pins that this spelling is a route and its morpheme sequence."
