      - signature: "X+Y+PRE+Z|[aá][+-=]?ps[+-=]?t"
        rules: ["PRE", "cr1", "cr2"]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
          - "CompoundingRule"
