  - word: dfbg
    note: '[cell reordered-prefix] C# returns 1 analysis (Y+PRE+X+Z|p[+-=]?s[aá]t[+-=]?): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: Y_reordered-prefix+PRE_reordered-prefix+X_reordered-prefix+Z_reordered-prefix|d[+-=]?f[bh]g[+-=]?
        rules:
