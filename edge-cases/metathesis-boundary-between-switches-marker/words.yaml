language: MetathesisBoundaryBetweenSwitchesMarker
requires: [phonology]
words:
  - word: "p"
    note: >-
      Root p alone: no prefix, so no switch pair exists.
    parses:
      - signature: "Y|p"
        rules: []
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > boundary between the switched segments"
  - word: "t"
    note: >-
      Root t alone: no prefix, so no switch pair exists.
    parses:
      - signature: "Z|t"
        rules: []
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > boundary between the switched segments"
  - word: "ts"
    note: >-
      The rule writes a boundary marker between the switches and the prefix carries two boundaries: the swap steps over both and they stay between the swapped segments.
    parses:
      - signature: "Z+PRE|t+?+?s"
        rules: [PRE, pr1]
        exercises: ["MetathesisRule"]
    exercises:
      - "MetathesisRule > boundary between the switched segments"
  - word: "t+s"
    note: >-
      The same surface with one boundary written: C# accepts it.
    parses:
      - signature: "Z+PRE|t+?+?s"
        rules: [PRE, pr1]
        exercises: ["MetathesisRule"]
    exercises:
      - "MetathesisRule > boundary between the switched segments"
  - word: "t++s"
    note: >-
      The same surface with both boundaries written: C# accepts it.
    parses:
      - signature: "Z+PRE|t+?+?s"
        rules: [PRE, pr1]
        exercises: ["MetathesisRule"]
    exercises:
      - "MetathesisRule > boundary between the switched segments"
  - word: "sp"
    note: >-
      Prefix s then root p: p is not a switch target, so nothing swaps (PRE+Y).
    parses:
      - signature: "PRE+Y|s+?+?p"
        rules: [PRE]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > boundary between the switched segments"
  - word: "s+p"
    note: >-
      Prefix s, one boundary, root p: no swap.
    parses:
      - signature: "PRE+Y|s+?+?p"
        rules: [PRE]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > boundary between the switched segments"
  - word: "s++p"
    note: >-
      Prefix s, both boundaries, root p: no swap.
    parses:
      - signature: "PRE+Y|s+?+?p"
        rules: [PRE]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > boundary between the switched segments"
  - word: "st"
    note: >-
      Never a surface: the obligatory rule rewrites st to ts, and C# rejects it.
    expect_fail: true
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > boundary between the switched segments"
  - word: "s+t"
    note: >-
      Never a surface: the obligatory rule rewrites s+t to t+s, and C# rejects it.
    expect_fail: true
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > boundary between the switched segments"
