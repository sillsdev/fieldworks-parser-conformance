# oracle-provenance: founding-oracle Machine e63b8863d37d3189c2b11fcaf9d43be74962ad70 (hc-conformance self-check, --propose; every signature is what C# returned on 2026-11-19, none taken from PanGloss staging)
language: FeaturelessSegmentClassRewrite
requires: [phonology]
fieldworks_producible: true
fieldworks_producible_notes: >-
  One phoneme has two spellings, as HCLoader LoadCharacterDefinitionTable emits from phoneme CodesOS. No fwdata round-trip witness is claimed.
words:
  - word: asa
    note: First output spelling is a positive control.
    parses:
      - signature: "AKA|a[sz]a"
        rules: [prLen]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
  - word: aza
    note: Second output spelling retains the same root identity in pinned C#.
    parses:
      - signature: "AKA|a[sz]a"
        rules: [prLen]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
  - word: aka
    note: Obligatory rewrite prevents the unchanged root from surfacing.
    expect_fail: true
