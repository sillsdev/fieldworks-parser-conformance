# These rows were measured from PR 627 head d26dd375 before it merged. At the time, pre-merge master and
# PR 627 differed on exactly one word, "bu": pre-merge master parsed it as BU, while PR 627 did not.
# Every other row matched on those two builds (see README.md).
#
# This fixture pins Morpher.LexicalLookup. The #627 change proposes only the root allomorph that matched the
# input, and skips an entry whose syntactic features do not unify with the input's. The second change only
# saves work and must not move any row. As of 2026-11-14, the PanGloss-pinned C# oracle (machine e63b8863)
# also gives "bu" no parse, matching expect_fail: true.

language: LexicalLookupSiblingAllomorphs
inspired_by: ["synthetic lexical-lookup probe (not modeling any real language)"]
sources:
  - "sillsdev/machine pull request 627: LexicalLookup only uses the allomorphs found by SearchRootAllomorphs"
  - "FieldWorks HCLoader.LoadRootAllomorph, HCLoader.cs (an allomorph's Require environment); the rule is prHiatusI, i -> 0 / [+high -cons] _, at the default Deletion Reapplications 0"
requires: [phonology]
words:
  - word: bu
    note: >-
      The sibling case. Analysis re-inserts at most one i after u (Deletion Reapplications 0), so it reaches bui and never buii. The matched allomorph bui requires a following consonant, and nothing follows it, so synthesis rejects it. Before #627 merged, master also tried the entry's other allomorph buii, which synthesises to "bu" because prHiatusI deletes both i's, and so parsed the word through a sibling that analysis never matched. The #627 change tries only bui; the current pinned oracle (e63b8863) therefore gives no parse, as expected.
    expect_fail: true
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"

  - word: tuk
    note: >-
      Control for the rule: TUIK loses its i to prHiatusI after u and surfaces as "tuk"; analysis restores the i and the single allomorph matches, on master and PR 627 alike.
    parses:
      - signature: "TUIK|tuk"
        rules: [prHiatusI]
        exercises: ["AffixProcessRule: prefix/suffix/circumfix/infix", "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]

  - word: bak
    note: >-
      Control: the entry's first allomorph matches and synthesises, on master and PR 627 alike.
    parses:
      - signature: "BAK|bak"
        rules: []
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"

  - word: baak
    note: >-
      Control: the entry's second allomorph is the one that matches, so dropping siblings does not lose it.
    parses:
      - signature: "BAK|baak"
        rules: []
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"

  - word: tak
    note: >-
      Syntactic-feature control: tak is both a noun (TAKN) and a verb (TAKV) and the bare word asks for no part of speech, so both homographs parse. Nothing is filtered.
    parses:
      - signature: "TAKN|tak"
        rules: []
      - signature: "TAKV|tak"
        rules: []
    exercises:
      - "Syntactic feature agreement (RequiredHeadFeatures/OutputHeadFeatures/RequiredFootFeatures/OutputFootFeatures)"

  - word: takt
    note: >-
      Syntactic-feature control: the noun suffix -t asks for a noun stem, so only the noun homograph parses. The #627 change skips the verb homograph before synthesis; pre-merge master tried it and rejected it later. The row is the same.
    parses:
      - signature: "TAKN+NSUF|takt"
        rules: [mrNounSuf]
    exercises:
      - "Syntactic feature agreement (RequiredHeadFeatures/OutputHeadFeatures/RequiredFootFeatures/OutputFootFeatures)"

  - word: taksa
    note: >-
      Syntactic-feature control: the verb suffix -sa asks for a verb stem, so only the verb homograph parses, the mirror of takt.
    parses:
      - signature: "TAKV+VSUF|taksa"
        rules: [mrVerbSuf]
    exercises:
      - "Syntactic feature agreement (RequiredHeadFeatures/OutputHeadFeatures/RequiredFootFeatures/OutputFootFeatures)"
