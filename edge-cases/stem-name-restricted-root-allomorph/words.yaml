# Rows kapat to mopat were added on 2026-11-27 from the C# self-check at sillsdev/machine ba6dfa10 (hc-conformance --propose); the earlier rows are from the oracle named below.
# The grammar gained a second region (num=pl) on snP1, a second stem name snP2 (pers=1), mrPlural, mrNeedsP (requiredStemName snP1) and the entry mop. HCLoader.cs loads every non-empty region of a stem name and writes requiredStemName on a derivational rule (LoadDerivAffixProcessRule). None of the earlier words changed.
# Oracle: pangloss (`pg_parse::Morpher`, driven directly via a temporary probe test -- see
# STAGING.md's "Verification" section), NOT the C# founding oracle. Signatures below are
# transcribed verbatim from that run, not hand-derived.

language: StemNameRestrictedRootAllomorph
inspired_by: ["synthetic principal-parts / stem-alternation probe (not modeling any real language)"]
sources:
  - "rust/crates/pg-foma/src/capability.rs, CharacteristicKind::StemName's own doc"
requires: []
words:
  - word: tam
    note: The unrestricted default allomorph, bare -- no featPers assigned at all, which is outside snP1's region, so the excluded-match check is satisfied trivially.
    parses:
      - signature: "ROOT|tam"
        gloss: root
        rules: []
        exercises:
          - "Stem names"

  - word: kap
    note: >-
      THE distinguishing row: the stemName="snP1" allomorph, bare -- its region requires
      featPers=1 to be ASSIGNED, but a bare form has no person feature at all, so the
      required-match fails. Zero parses. An engine that ignores RootAllomorphDef::stem_name
      entirely (proposes every allomorph unconditionally, per capability.rs's own StemName doc)
      would wrongly accept this.
    expect_fail: true
    exercises:
      - "Stem names"

  - word: kapom
    note: The stemName="snP1" allomorph + mrPers1 (assigns featPers=1) -- the word's FS now falls inside snP1's region, so the required-match succeeds.
    provenance: "capability.rs, CharacteristicKind::StemName's own doc (RootAllomorphDef::stem_name / StemName.IsRequiredMatch)"
    parses:
      - signature: "ROOT+PERS1|kapom"
        gloss: root-1
        rules: [mrPers1]
        exercises:
          - "Stem names"

  - word: tamom
    note: >-
      THE mirror-image distinguishing row: the DEFAULT allomorph + mrPers1 -- featPers=1 now
      puts the word's FS INSIDE snP1's region, so the default's excluded-match check FAILS (it is
      valid only outside every declared StemName's region). Zero parses. The same
      flat-proposal bug would wrongly accept this too, using the wrong allomorph for this
      person.
    expect_fail: true
    exercises:
      - "Stem names"

  - word: tamur
    note: The default allomorph + mrPers2 (assigns featPers=2) -- outside snP1's region, so the excluded-match check succeeds.
    provenance: "capability.rs, CharacteristicKind::StemName's own doc (RootAllomorphDef::stem_name / StemName.IsExcludedMatch)"
    parses:
      - signature: "ROOT+PERS2|tamur"
        gloss: root-2
        rules: [mrPers2]
        exercises:
          - "Stem names"

  - word: kapur
    note: The stemName="snP1" allomorph + mrPers2 -- featPers=2 is outside snP1's region, so the required-match fails (this allomorph is valid only inside its own region).
    expect_fail: true
    exercises:
      - "Stem names"

  - word: kapat
    note: >-
      The snP1 allomorph with mrPlural (num=pl). The word carries no person, so it is outside snP1's first region,
      but num=pl is snP1's second region: the allomorph is valid. Only the second region admits it.
    parses:
      - signature: "ROOT+PLURAL|kapat"
        gloss: root-PLURAL
        rules: [mrPlural]
        exercises: ["Stem names"]

  - word: tamat
    note: >-
      The default allomorph with num=pl: the word is inside snP1's second region, which excludes the default
      allomorph.
    expect_fail: true
    exercises: ["Stem names"]

  - word: kapurat
    note: >-
      pers=2 then num=pl: pers=2 is outside the first region but the word is inside the second, so the snP1
      allomorph is valid. Control: kapur, with pers=2 alone, is refused.
    parses:
      - signature: "ROOT+PERS2+PLURAL|kapurat"
        gloss: root-2-PLURAL
        rules: [mrPers2, mrPlural]
        exercises: ["Stem names"]

  - word: kapak
    note: >-
      The snP1 allomorph with mrNeedsP, which requires stem name snP1 and assigns pers=1 (inside the first
      region).
    parses:
      - signature: "ROOT+NEEDSP|kapak"
        gloss: root-NEEDSP
        rules: [mrNeedsP]
        exercises: ["Stem names"]

  - word: mopom
    note: >-
      mop carries snP2, whose one region is pers=1, and mrPers1 puts the word in it. Control for mopak.
    parses:
      - signature: "MOP+PERS1|mopom"
        gloss: mop-1
        rules: [mrPers1]
        exercises: ["Stem names"]

  - word: mopak
    note: >-
      The word is inside snP2's region, so mop is valid by itself, but mrNeedsP requires stem name snP1 and mop
      carries snP2: only requiredStemName refuses it.
    expect_fail: true
    blocked_by: [mrNeedsP]
    exercises: ["Stem names"]

  - word: mopat
    note: >-
      num=pl is not in snP2's only region (pers=1), so mop is refused.
    expect_fail: true
    exercises: ["Stem names"]
