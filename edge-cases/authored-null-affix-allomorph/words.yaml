# A suffix entry whose allomorph form is the authored null form "∅" (U+2205), as FieldWorks stores it, beside an
# overt allomorph, plus a zero-marked relative suffix. The null morph is a real morph of the bare word.
language: AuthoredNullAffixAllomorph
inspired_by: ["a FieldWorks suffix entry with an authored null allomorph (sillsdev/motif#362)"]
sources: ["https://github.com/sillsdev/motif/issues/362", "FieldWorks HCLoader.LoadFormAffixProcessAllomorph"]
requires: []
words:
  - word: kaun
    note: The null tense allomorph (after n) and the zero relative marker both fill their required slots, so the bare stem parses with two null morphs.
    provenance: "https://github.com/sillsdev/motif/issues/362"
    parses:
      - signature: "KAUN+PST+REL|kaun+?[(^0)(*0)(&0)∅]?+?[(^0)(*0)(&0)∅]?"
        rules: [mrPst, mrRel]
        exercises: ["AffixProcessRule: prefix/suffix/circumfix/infix", "Boundary markers (CharacterDefinitionTable)", "Affix template slots (obligatory/disjunctive/ordering)"]
  - word: katta
    note: After t the overt -ta tense allomorph applies and the zero relative marker still fills its slot.
    provenance: "https://github.com/sillsdev/motif/issues/362"
    parses:
      - signature: "KAT+PST+REL|kat+?ta+?[(^0)(*0)(&0)∅]?"
        rules: [mrPst, mrRel]
  - word: kaunta
    note: The overt -ta allomorph is conditioned to follow t, so it cannot follow n.
    provenance: "https://github.com/sillsdev/motif/issues/362"
    expect_fail: true
    blocked_by: [mrPst]
  - word: kaun0
    note: The null allomorph is the boundary ∅, not the literal segment 0, so a word ending in the real segment 0 does not parse.
    provenance: "https://github.com/sillsdev/motif/issues/362"
    expect_fail: true
    blocked_by: [mrPst, mrRel]
  - word: kat0
    note: Neither tense allomorph adds a literal 0 after t, so this word does not parse either.
    provenance: "https://github.com/sillsdev/motif/issues/362"
    expect_fail: true
    blocked_by: [mrPst, mrRel]
