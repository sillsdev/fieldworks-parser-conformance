language: MetathesisSegmentClassUnion
requires:
  - phonology
words:
  - word: a
    note: '[cell class-union] R0 is underlying a; nothing swaps: C# gives R0|a.'
    parses:
      - signature: R0_class-union|a
        rules: []
    exercises:
      - MetathesisRule > segment-class union in the switch
  - word: p
