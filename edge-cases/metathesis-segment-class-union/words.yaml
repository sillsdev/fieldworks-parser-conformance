  - word: ap
    note: '[cell class-union] R2 is underlying pa; the class {s,t} matches the union of its members'' features, f and g with either value, so every segment matches it and the rule swaps it with a following a: C# gives R2|ap.'
    parses:
      - signature: R2_class-union|ap
        rules:
          - pr0_class-union
    exercises:
      - MetathesisRule > segment-class union in the switch
