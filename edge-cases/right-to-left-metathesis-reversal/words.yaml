# oracle-provenance: founding-oracle machine-source=aab4c598
# Graduation rechecks complete word/status/signature multiplicities and rule traces.
# Earlier provenance comments below describe the original authoring history.
# original oracle-provenance: founding-oracle
# Synthetic construct-shaped probe. Rows were replayed at sillsdev/machine ba6dfa106 (#615 tip).

language: RightToLeftMetathesisReversal
inspired_by: ["synthetic right-to-left metathesis-reversal probe (not modeling any real language)"]
sources: []
requires: [phonology]
fieldworks_producible: true
words:
  - word: sq
    note: >-
      ROOT1's correctly-metathesized surface form: underlying "qs" (SwitchA={q,r} then
      SwitchB={r,s,t}), leftSwitch tags SwitchB (physically last), so the swap puts SwitchB's own
      value first and SwitchA's second: "s"+"q" = "sq". ROOT1 has exactly one switch window, so this
      word alone cannot tell rightToLeftIterative from leftToRightIterative; ROOT3 below does.
    parses:
      - signature: "ROOT1|sq"
        rules: [mrRtlReversal]
        exercises:
          - "MetathesisRule"

  - word: tr
    note: >-
      ROOT2's correctly-metathesized surface form: underlying "rt", same rule, same reorder
      algorithm -- "t"+"r" = "tr". A second, independent root so the "sr"/"tq" negative controls
      below are a genuine cross-contamination check (neither root's own raw nor swapped form),
      not merely "no root exists with this shape at all".
    parses:
      - signature: "ROOT2|tr"
        rules: [mrRtlReversal]
        exercises:
          - "MetathesisRule"

  - word: qs
    note: >-
      ROOT1's own RAW underlying shape, queried directly as a surface string -- metathesis is
      obligatory wherever its pattern matches, so this exact string is NOT a valid surface form for
      ROOT1 at all (it should have metathesized to "sq"). Proves the rule genuinely fires
      (obligatorily) under its own Dir::RightToLeft declaration, rather than being vacuously
      never-applicable.
    expect_fail: true
    exercises:
      - "MetathesisRule"

  - word: rt
    note: ROOT2's own RAW underlying shape, queried directly -- same reasoning as "qs" (should have metathesized to "tr").
    expect_fail: true
    exercises:
      - "MetathesisRule"

  - word: sr
    note: >-
      Every OTHER combination of SwitchA={q,r} x SwitchB={s,t} this rule's own pattern could also
      match against SOME root -- but neither ROOT1 ("qs"/"sq") nor ROOT2 ("rt"/"tr") has this
      shape. Precision negative control: no root has this shape, so the swap does not cross-contaminate
      the members of the two classes.
    expect_fail: true
    exercises:
      - "MetathesisRule"

  - word: tq
    note: The remaining spurious combination -- same reasoning as "sr".
    expect_fail: true
    exercises:
      - "MetathesisRule"

  - word: qsr
    note: >-
      ROOT3 (underlying "qrs") has two overlapping switch windows, q+r and r+s, because r is in both
      SwitchA and SwitchB. The rule is rightToLeftIterative, so it swaps the right window r+s and
      the surface is "qsr". leftToRightIterative would swap q+r and give "rqs" instead, so this is the
      word that tells the two directions apart.
    parses:
      - signature: "ROOT3|qsr"
        rules: [mrRtlReversal]
        exercises:
          - "MetathesisRule"
  - word: rqs
    note: >-
      The leftToRightIterative surface of ROOT3 (swap of q+r). It has no analysis here because the rule
      is rightToLeftIterative; if an engine reads the attribute the other way, this word parses and
      "qsr" does not.
    expect_fail: true
    exercises:
      - "MetathesisRule"
  - word: qrs
    note: ROOT3's raw underlying shape. The rule is obligatory where a window matches, so it is not a surface form.
    expect_fail: true
    exercises:
      - "MetathesisRule"
