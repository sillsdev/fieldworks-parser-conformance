language: ConvergentCliticStratumHomophonous
inspired_by: ["synthetic enclitics homophonous with derivational suffixes of an inner stratum (not modeling any real language)"]
sources: ["sillsdev/machine#653", "PanGloss issue 477", "PanGloss issue 481", "PanGloss PR 480", "FieldWorks HCLoader.cs strata Morphology and Clitics"]
requires: []
fieldworks_producible_notes: >-
  Four derivational suffixes share one form and differ only in category (noun to noun, noun to verb, verb to noun, verb to verb), as FieldWorks writes homophonous derivational affixes (HCLoader.cs LoadDerivAffixProcessRule).
  The strata are the Morphology and Clitics strata FieldWorks writes, both unordered. Three enclitics in the
  Clitics stratum have the same form as the four derivational suffixes in the Morphology stratum, so one
  shape is reached in both strata by different rules. The phonemes carry no phonological features.
words:
  - word: kat
    note: "Bare noun root control."
    parses:
      - signature: "KAT|kat"
        rules: []
  - word: sum
    note: "Bare verb root control."
    parses:
      - signature: "SUM|sum"
        rules: []
  - word: kata
    note: "One -a: two noun-taking suffixes and two enclitics that accept a noun."
    parses:
      - signature: "KAT+ANN|kat+?a"
        rules: [aNN]
        exercises: ["Clitics stratum: clitic designation by stratum name alone", "AffixProcessRule: prefix/suffix/circumfix/infix"]
      - signature: "KAT+ANV|kat+?a"
        rules: [aNV]
      - signature: "KAT+CLANY|kat+?a"
        rules: [clC]
      - signature: "KAT+CLAN|kat+?a"
        rules: [clA]
  - word: suma
    note: "One -a on the verb root."
    parses:
      - signature: "SUM+AVN|sum+?a"
        rules: [aVN]
      - signature: "SUM+AVV|sum+?a"
        rules: [aVV]
      - signature: "SUM+CLANY|sum+?a"
        rules: [clC]
      - signature: "SUM+CLAV|sum+?a"
        rules: [clB]
  - word: katsi
    note: "The -si verbalizer alone."
    parses:
      - signature: "KAT+SI|kat+?si"
        rules: [si]
  - word: katasi
    note: "A noun-to-noun -a under -si; an enclitic cannot stand inside a suffix."
    parses:
      - signature: "KAT+ANN+SI|kat+?a+?si"
        rules: [aNN, si]
  - word: katsia
    note: "-a outside -si: verb-taking suffixes and enclitics."
    parses:
      - signature: "KAT+SI+AVN|kat+?si+?a"
        rules: [aVN, si]
      - signature: "KAT+SI+AVV|kat+?si+?a"
        rules: [aVV, si]
      - signature: "KAT+SI+CLANY|kat+?si+?a"
        rules: [clC, si]
      - signature: "KAT+SI+CLAV|kat+?si+?a"
        rules: [clB, si]
  - word: katasia
    note: "-a on both sides of -si."
    parses:
      - signature: "KAT+ANN+SI+AVN|kat+?a+?si+?a"
        rules: [aNN, aVN, si]
      - signature: "KAT+ANN+SI+AVV|kat+?a+?si+?a"
        rules: [aNN, aVV, si]
      - signature: "KAT+ANN+SI+CLANY|kat+?a+?si+?a"
        rules: [aNN, clC, si]
      - signature: "KAT+ANN+SI+CLAV|kat+?a+?si+?a"
        rules: [aNN, clB, si]
  - word: sumsia
    note: "-si needs a noun."
    expect_fail: true
  - word: sumasia
    note: "The verb root is nominalized by -a before -si."
    parses:
      - signature: "SUM+AVN+SI+AVV|sum+?a+?si+?a"
        rules: [aVN, aVV, si]
      - signature: "SUM+AVN+SI+CLANY|sum+?a+?si+?a"
        rules: [aVN, clC, si]
      - signature: "SUM+AVN+SI+CLAV|sum+?a+?si+?a"
        rules: [aVN, clB, si]
  - word: akat
    note: "No prefix exists."
    expect_fail: true
  - word: katsisi
    note: "-si applies once and needs a noun."
    expect_fail: true
  - word: kataa
    note: "Same-form a affixes across the Morphology and Clitics strata: C# keeps CLAN+CLANY and CLANY+CLAN as separate analyses."
    parses:
      - signature: "KAT+ANN+ANV|kat+?a+?a"
        rules: [aNN, aNV]
      - signature: "KAT+ANN+CLANY|kat+?a+?a"
        rules: [aNN, clC]
      - signature: "KAT+ANN+CLAN|kat+?a+?a"
        rules: [aNN, clA]
      - signature: "KAT+ANV+AVN|kat+?a+?a"
        rules: [aNV, aVN]
      - signature: "KAT+ANV+AVV|kat+?a+?a"
        rules: [aNV, aVV]
      - signature: "KAT+ANV+CLANY|kat+?a+?a"
        rules: [aNV, clC]
      - signature: "KAT+ANV+CLAV|kat+?a+?a"
        rules: [aNV, clB]
      - signature: "KAT+CLAN+CLANY|kat+?a+?a"
        rules: [clA, clC]
      - signature: "KAT+CLANY+CLAN|kat+?a+?a"
        rules: [clA, clC]
  - word: sumaa
    note: "As kataa on a verb root."
    parses:
      - signature: "SUM+AVN+ANN|sum+?a+?a"
        rules: [aNN, aVN]
      - signature: "SUM+AVN+ANV|sum+?a+?a"
        rules: [aNV, aVN]
      - signature: "SUM+AVN+CLANY|sum+?a+?a"
        rules: [aVN, clC]
      - signature: "SUM+AVN+CLAN|sum+?a+?a"
        rules: [aVN, clA]
      - signature: "SUM+AVV+AVN|sum+?a+?a"
        rules: [aVN, aVV]
      - signature: "SUM+AVV+CLANY|sum+?a+?a"
        rules: [aVV, clC]
      - signature: "SUM+AVV+CLAV|sum+?a+?a"
        rules: [aVV, clB]
      - signature: "SUM+CLANY+CLAV|sum+?a+?a"
        rules: [clB, clC]
      - signature: "SUM+CLAV+CLANY|sum+?a+?a"
        rules: [clB, clC]
  - word: kataaa
    note: "Three same-form a affixes: every order C# accepts is its own analysis."
    parses:
      - signature: "KAT+ANN+ANV+AVN|kat+?a+?a+?a"
        rules: [aNN, aNV, aVN]
      - signature: "KAT+ANN+ANV+AVV|kat+?a+?a+?a"
        rules: [aNN, aNV, aVV]
      - signature: "KAT+ANN+ANV+CLANY|kat+?a+?a+?a"
        rules: [aNN, aNV, clC]
      - signature: "KAT+ANN+ANV+CLAV|kat+?a+?a+?a"
        rules: [aNN, aNV, clB]
      - signature: "KAT+ANN+CLAN+CLANY|kat+?a+?a+?a"
        rules: [aNN, clA, clC]
      - signature: "KAT+ANN+CLANY+CLAN|kat+?a+?a+?a"
        rules: [aNN, clA, clC]
      - signature: "KAT+ANV+AVN+ANN|kat+?a+?a+?a"
        rules: [aNN, aNV, aVN]
      - signature: "KAT+ANV+AVN+CLANY|kat+?a+?a+?a"
        rules: [aNV, aVN, clC]
      - signature: "KAT+ANV+AVN+CLAN|kat+?a+?a+?a"
        rules: [aNV, aVN, clA]
      - signature: "KAT+ANV+AVV+AVN|kat+?a+?a+?a"
        rules: [aNV, aVN, aVV]
      - signature: "KAT+ANV+AVV+CLANY|kat+?a+?a+?a"
        rules: [aNV, aVV, clC]
      - signature: "KAT+ANV+AVV+CLAV|kat+?a+?a+?a"
        rules: [aNV, aVV, clB]
      - signature: "KAT+ANV+CLANY+CLAV|kat+?a+?a+?a"
        rules: [aNV, clB, clC]
      - signature: "KAT+ANV+CLAV+CLANY|kat+?a+?a+?a"
        rules: [aNV, clB, clC]
