language: MetathesisBoundaryBetweenSwitchesCompound
requires:
  - phonology
words:
  - word: p
    note: '[cell compound] Root p alone: no compound, so no switch pair exists.'
    parses:
      - signature: Y_compound|p
        rules: []
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: t
    note: '[cell compound] Root t alone: no compound, so no switch pair exists.'
    parses:
      - signature: Z_compound|t
        rules: []
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: pp
    note: '[cell compound] Compound of p and p: no t-then-p pair, so nothing swaps.'
    parses:
      - signature: Y_compound|p+?p
        rules:
          - cr1_compound
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: pt
    note: '[cell compound] Surface of the compound t then p with a junction boundary between the switches: the swap steps over the boundary and lists the morphs in surface order (Y+Z); C# returns the analysis twice.'
    parses:
      - signature: Y_compound+Z_compound|p+?t
        rules:
          - cr1_compound
          - pr1_compound
      - signature: Y_compound+Z_compound|p+?t
        rules:
          - cr1_compound
          - pr1_compound
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: tt
    note: '[cell compound] Compound of t and t: no p after the t, so nothing swaps.'
    parses:
      - signature: Z_compound|t+?t
        rules:
          - cr1_compound
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: p+p
    note: '[cell compound] Compound of p and p with the junction boundary written: no swap.'
    parses:
      - signature: Y_compound|p+?p
        rules:
          - cr1_compound
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: p+t
    note: '[cell compound] The pt surface with the junction boundary written: the same two analyses as pt.'
    parses:
      - signature: Y_compound+Z_compound|p+?t
        rules:
          - cr1_compound
          - pr1_compound
      - signature: Y_compound+Z_compound|p+?t
        rules:
          - cr1_compound
          - pr1_compound
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: t+t
    note: '[cell compound] Compound of t and t with the junction boundary written: no swap.'
    parses:
      - signature: Z_compound|t+?t
        rules:
          - cr1_compound
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: tp
    note: '[cell compound] Never a surface: the obligatory rule rewrites tp to pt, and C# rejects it.'
    expect_fail: true
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: t+p
    note: '[cell compound] Never a surface: the obligatory rule rewrites t+p to p+t, and C# rejects it.'
    expect_fail: true
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: d
    note: '[cell marker] Root p alone: no prefix, so no switch pair exists.'
    parses:
      - signature: Y_marker|d
        rules: []
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: g
    note: '[cell marker] Root t alone: no prefix, so no switch pair exists.'
    parses:
      - signature: Z_marker|g
        rules: []
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: gf
    note: '[cell marker] The rule writes a boundary marker between the switches and the prefix carries two boundaries: the swap steps over both and they stay between the swapped segments.'
    parses:
      - signature: Z_marker+PRE_marker|g+?+?f
        rules:
          - PRE_marker
          - pr1_marker
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: g+f
    note: '[cell marker] The same surface with one boundary written: C# accepts it.'
    parses:
      - signature: Z_marker+PRE_marker|g+?+?f
        rules:
          - PRE_marker
          - pr1_marker
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: g++f
    note: '[cell marker] The same surface with both boundaries written: C# accepts it.'
    parses:
      - signature: Z_marker+PRE_marker|g+?+?f
        rules:
          - PRE_marker
          - pr1_marker
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: fd
    note: '[cell marker] Prefix s then root p: p is not a switch target, so nothing swaps (PRE+Y).'
    parses:
      - signature: PRE_marker+Y_marker|f+?+?d
        rules:
          - PRE_marker
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: f+d
    note: '[cell marker] Prefix s, one boundary, root p: no swap.'
    parses:
      - signature: PRE_marker+Y_marker|f+?+?d
        rules:
          - PRE_marker
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: f++d
    note: '[cell marker] Prefix s, both boundaries, root p: no swap.'
    parses:
      - signature: PRE_marker+Y_marker|f+?+?d
        rules:
          - PRE_marker
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: fg
    note: '[cell marker] Never a surface: the obligatory rule rewrites st to ts, and C# rejects it.'
    expect_fail: true
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: f+g
    note: '[cell marker] Never a surface: the obligatory rule rewrites s+t to t+s, and C# rejects it.'
    expect_fail: true
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: j
    note: '[cell prefix] Root p alone: no prefix, so no switch pair exists.'
    parses:
      - signature: Y_prefix|j
        rules: []
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: l
    note: '[cell prefix] Root t alone: no prefix, so no switch pair exists.'
    parses:
      - signature: Z_prefix|l
        rules: []
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: lk
    note: '[cell prefix] Surface of prefix s, a morph boundary, then root t: the switches are split by the boundary, the swap steps over it and the boundary stays between the swapped segments (t+?s).'
    parses:
      - signature: Z_prefix+PRE_prefix|l+?k
        rules:
          - PRE_prefix
          - pr1_prefix
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: kj
    note: '[cell prefix] Prefix s then root p: p is not a switch target, so nothing swaps (PRE+Y).'
    parses:
      - signature: PRE_prefix+Y_prefix|k+?j
        rules:
          - PRE_prefix
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: l+k
    note: '[cell prefix] The same surface with the boundary written: C# accepts it and the boundary stays between the swapped segments.'
    parses:
      - signature: Z_prefix+PRE_prefix|l+?k
        rules:
          - PRE_prefix
          - pr1_prefix
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: k+j
    note: '[cell prefix] Prefix s, boundary, root p: no swap, and the written boundary is the prefix boundary (PRE+Y).'
    parses:
      - signature: PRE_prefix+Y_prefix|k+?j
        rules:
          - PRE_prefix
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: kl
    note: '[cell prefix] Never a surface: the obligatory rule rewrites st to ts, and C# rejects it.'
    expect_fail: true
    exercises:
      - MetathesisRule > boundary between the switched segments
  - word: k+l
    note: '[cell prefix] Never a surface: the obligatory rule rewrites s+t to t+s, and C# rejects it.'
    expect_fail: true
    exercises:
      - MetathesisRule > boundary between the switched segments
