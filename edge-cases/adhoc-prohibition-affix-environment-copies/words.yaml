          - MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule
  - word: taga
    note: '[cell affix-environment] Control: ga has no prohibition, so the prefix attaches once per prefix MSA, both times through the before-consonant environment copy (the after-a copy never matches word-initially).'
    parses:
      - signature: TA1_affix-environment+GA_affix-environment|taga
        rules:
          - mrTa1_affix-environment
        exercises:
          - MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule
      - signature: TA2_affix-environment+GA_affix-environment|taga
        rules:
          - mrTa2_affix-environment
        exercises:
          - MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule
  - word: tada
    note: '[cell affix-environment] Prefix first: the prohibition ta- ~ da is declared on all four copies of the prefix allomorph (two MSAs x two environments). The only copies that match here are the before-consonant ones; both are excluded, so the word has no analysis.'
    expect_fail: true
    blocked_by:
      - subTa1b_affix-environment
      - subTa2b_affix-environment
    exercises:
      - MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule
  - word: taba
    note: '[cell affix-environment] Stem first: the prohibition ba ~ ta- is declared on ba once per prefix copy on the rest side. Both matching copies are excluded, so the word has no analysis.'
    expect_fail: true
    blocked_by:
