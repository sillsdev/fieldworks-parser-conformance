language: AdhocProhibitionAffixEnvironmentCopies
inspired_by:
  - a prefix allomorph with two environments and two affix MSAs compiles to one allomorph copy per MSA per environment; an ad hoc allomorph prohibition names the one prefix allomorph, and HCLoader attaches it to every copy
  - a prefix entry with two equal affix MSAs (MergeMSAs off) compiles to two morphological rules; an ad hoc allomorph prohibition names the one prefix allomorph, and HCLoader attaches it to every copy
  - a circumfix entry with two prefix halves and two suffix halves compiles to four pairing subrules; an ad hoc allomorph prohibition naming the circumfix lexeme form is attached to every pairing; one naming a single half resolves to nothing
sources:
  - HCLoader.cs:1160-1178 (LoadAffixProcessAllomorphs)
  - HCLoader.cs:2212-2236 (LoadAllomorphCoOccurrenceRules)
  - HCLoader.cs:2163-2189 (LoadAllomorphCoOccurrenceRules)
  - HCLoader.cs:1097-1122 (LoadAffixProcessAllomorphs, circumfix branch)
requires: []
words:
  - word: da
    note: '[cell affix-environment] Control: bare stem da parses.'
    parses:
      - signature: DA_affix-environment|da
        rules: []
        exercises:
          - MorphemeCoOccurrenceRule/AllomorphCoOccurrenceRule
  - word: ba
