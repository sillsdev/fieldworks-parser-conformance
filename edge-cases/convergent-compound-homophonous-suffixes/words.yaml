language: ConvergentCompoundHomophonousSuffixes
inspired_by: ["synthetic noun-noun and verb-noun compounds under homophonous category-changing suffixes (not modeling any real language)"]
sources: ["sillsdev/machine#653", "PanGloss issue 477", "PanGloss issue 481", "PanGloss PR 480", "FieldWorks HCLoader.cs LoadEndoCompoundingRule"]
requires: []
fieldworks_producible_notes: >-
  Four derivational suffixes share one form and differ only in category (noun to noun, noun to verb, verb to noun, verb to verb), as FieldWorks writes homophonous derivational affixes (HCLoader.cs LoadDerivAffixProcessRule).
  The two compounding rules are the endocentric shape the loader writes: head and non-head are any one or
  more segments, joined by the + boundary; the noun-noun rule is right-headed and carries the compound
  maxApps setting, the verb-noun rule is left-headed. The phonemes carry no phonological features.
words:
  - word: kat
    note: "Bare noun root control."
    parses:
      - signature: "KAT|kat"
        rules: []
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: mis
    note: "Bare verb root control."
    parses:
      - signature: "MIS|mis"
        rules: []
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: katkat
    note: "Right-headed noun-noun compound of one root with itself."
    parses:
      - signature: "KAT|kat+?kat"
        rules: [cmpNN]
        exercises: ["CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)", "AffixProcessRule: prefix/suffix/circumfix/infix"]
  - word: katkatkat
    note: "Three stems exceed the stem limit."
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: katkatkatkat
    note: "Four stems exceed the stem limit."
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: miskat
    note: "Left-headed verb-noun compound."
    parses:
      - signature: "MIS+KAT|mis+?kat"
        rules: [cmpVN]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: miskatkat
    note: "No rule takes a compound verb and a further noun within the stem limit."
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: katmissi
    note: "The verb must be nominalized before it can head a noun-noun compound."
    parses:
      - signature: "KAT+MIS+SIVN|kat+?mis+?si"
        rules: [cmpNN, siVN]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: katmissisi
    note: "Two stacked -si over the compound: suffix un-application converges before the compound rule is tried."
    parses:
      - signature: "KAT+MIS+SIVN+SINN|kat+?mis+?si+?si"
        rules: [cmpNN, siNN, siVN]
      - signature: "KAT+MIS+SIVN+SINN|kat+?mis+?si+?si"
        rules: [cmpNN, siNN, siVN]
      - signature: "KAT+MIS+SIVN+SINV|kat+?mis+?si+?si"
        rules: [cmpNN, siNV, siVN]
      - signature: "KAT+MIS+SIVV+SIVN|kat+?mis+?si+?si"
        rules: [cmpNN, siVN, siVV]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: katkatsi
    note: "Noun-taking -si over the noun-noun compound; the suffix may also sit on the head inside it."
    parses:
      - signature: "KAT+SINN|kat+?kat+?si"
        rules: [cmpNN, siNN]
      - signature: "KAT+SINN|kat+?kat+?si"
        rules: [cmpNN, siNN]
      - signature: "KAT+SINV|kat+?kat+?si"
        rules: [cmpNN, siNV]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: katkatsisi
    note: "Two stacked -si over the noun-noun compound."
    parses:
      - signature: "KAT+SINN+SINV|kat+?kat+?si+?si"
        rules: [cmpNN, siNN, siNV]
      - signature: "KAT+SINN+SINV|kat+?kat+?si+?si"
        rules: [cmpNN, siNN, siNV]
      - signature: "KAT+SINV+SIVN|kat+?kat+?si+?si"
        rules: [cmpNN, siNV, siVN]
      - signature: "KAT+SINV+SIVN|kat+?kat+?si+?si"
        rules: [cmpNN, siNV, siVN]
      - signature: "KAT+SINV+SIVV|kat+?kat+?si+?si"
        rules: [cmpNN, siNV, siVV]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: miskatsi
    note: "Verb-taking -si over the verb-noun compound."
    parses:
      - signature: "MIS+KAT+SIVN|mis+?kat+?si"
        rules: [cmpVN, siVN]
      - signature: "MIS+KAT+SIVV|mis+?kat+?si"
        rules: [cmpVN, siVV]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: miskatsisi
    note: "Two stacked -si over the verb-noun compound."
    parses:
      - signature: "MIS+KAT+SIVN+SINN|mis+?kat+?si+?si"
        rules: [cmpVN, siNN, siVN]
      - signature: "MIS+KAT+SIVN+SINV|mis+?kat+?si+?si"
        rules: [cmpVN, siNV, siVN]
      - signature: "MIS+KAT+SIVV+SIVN|mis+?kat+?si+?si"
        rules: [cmpVN, siVN, siVV]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: missi
    note: "The verb-taking -si suffixes."
    parses:
      - signature: "MIS+SIVN|mis+?si"
        rules: [siVN]
      - signature: "MIS+SIVV|mis+?si"
        rules: [siVV]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: katsi
    note: "The noun-taking -si suffixes."
    parses:
      - signature: "KAT+SINN|kat+?si"
        rules: [siNN]
      - signature: "KAT+SINV|kat+?si"
        rules: [siNV]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: katmis
    note: "Noun then bare verb fits neither compound rule."
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: katsimis
    note: "Noun then bare verb fits neither compound rule, suffixed or not."
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: katkatmissi
    note: "Three stems exceed the stem limit."
    expect_fail: true
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
