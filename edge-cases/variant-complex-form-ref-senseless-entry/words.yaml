# Synthetic; no real language. tu is a sense-less entry whose one LexEntryRef is a complex-form ref (no variant types) to ta;
# HCLoader loads every entry ref of a sense-less entry as a variant source (HCLoader.cs:639-668, GetInflTypes 706-710).
language: VariantComplexFormRef
inspired_by: ["a sense-less entry whose only entry ref is a complex-form ref is a variant of its component for HCLoader"]
sources: ["HCLoader.cs:639-668 (LoadLexEntries)", "HCLoader.cs:706-710 (GetInflTypes)"]
requires: []
words:
  - word: ta
    note: >-
      Control: the main stem.
    parses:
      - signature: "TA|ta"
        rules: []
        exercises: ["Variant entries (sense-less entry loaded under its component entry's MSA)"]
  - word: tu
    note: >-
      The sense-less entry tu with a complex-form ref to ta parses as ta's Noun MSA, like any variant. A loader that treats a complex-form ref as no variant source gives no analysis.
    parses:
      - signature: "TA|tu"
        rules: []
        exercises: ["Variant entries (sense-less entry loaded under its component entry's MSA)"]
  - word: tata
    note: >-
      Control: no compounding, so a doubled stem has no analysis.
    expect_fail: true
    exercises: ["Variant entries (sense-less entry loaded under its component entry's MSA)"]
