      - signature: "NEG+TAK+IVV+IVN|an+?tak+?i+?i"
        rules: [iVN, iVV, neg, prAssim]
  - word: aŋkamii
    note: "Two stacked -i with dorsal assimilation."
    parses:
      - signature: "NEG+KAM+INN+INV|aŋ+?kam+?i+?i"
        rules: [iNN, iNV, neg, prAssim]
