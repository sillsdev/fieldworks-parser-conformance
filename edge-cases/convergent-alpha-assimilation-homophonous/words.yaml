        rules: [iNN, iNV, neg, prAssim]
      - signature: "NEG+KAM+INN+INV|aŋ+?kam+?i+?i"
        rules: [iNN, iNV, neg, prAssim]
      - signature: "NEG+KAM+INV+IVN|aŋ+?kam+?i+?i"
        rules: [iNV, iVN, neg, prAssim]
      - signature: "NEG+KAM+INV+IVN|aŋ+?kam+?i+?i"
        rules: [iNV, iVN, neg, prAssim]
      - signature: "NEG+KAM+INV+IVN|aŋ+?kam+?i+?i"
        rules: [iNV, iVN, neg, prAssim]
      - signature: "NEG+KAM+INV+IVV|aŋ+?kam+?i+?i"
        rules: [iNV, iVV, neg, prAssim]
      - signature: "NEG+KAM+INV+IVV|aŋ+?kam+?i+?i"
        rules: [iNV, iVV, neg, prAssim]
      - signature: "NEG+KAM+INV+IVV|aŋ+?kam+?i+?i"
        rules: [iNV, iVV, neg, prAssim]
  - word: anpat
    note: "An unassimilated nasal before p cannot surface."
    expect_fail: true
  - word: amtak
    note: "A labial nasal before t cannot surface."
    expect_fail: true
  - word: ankam
    note: "A coronal nasal before k cannot surface."
    expect_fail: true
  - word: amampat
    note: "The prefix applies once."
    expect_fail: true
  - word: anampat
    note: "The prefix applies once."
