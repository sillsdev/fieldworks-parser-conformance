      - signature: R1_segments+SUF2_segments|jl+?khj
        rules:
          - SUF2_segments
          - pr1_segments
    exercises:
      - MetathesisRule > boundary in the switch context
  - word: jl+khj
    note: '[cell segments] R1+SUF0+SUF1 is underlying pst+a+p; the root s and t swap before the context a p; only segments move, and the root''s boundary closes the group of t, so s lands after that boundary: C# gives R1+SUF0+SUF1|pt+?sa+?p. R1+SUF2 is underlying pst+ap; the root s and t swap before the context a p; only segments move, and the root''s boundary closes the group of t, so s lands after that boundary: C# gives R1+SUF2|pt+?sap.'
    parses:
      - signature: R1_segments+SUF0_segments+SUF1_segments|jl+?kh+?j
        rules:
          - SUF0_segments
          - SUF1_segments
          - pr1_segments
      - signature: R1_segments+SUF2_segments|jl+?khj
        rules:
          - SUF2_segments
          - pr1_segments
    exercises:
      - MetathesisRule > boundary in the switch context
  - word: jl+kh+j
    note: '[cell segments] R1+SUF0+SUF1 is underlying pst+a+p; the root s and t swap before the context a p; only segments move, and the root''s boundary closes the group of t, so s lands after that boundary: C# gives R1+SUF0+SUF1|pt+?sa+?p.'
    parses:
      - signature: R1_segments+SUF0_segments+SUF1_segments|jl+?kh+?j
        rules:
          - SUF0_segments
          - SUF1_segments
          - pr1_segments
    exercises:
      - MetathesisRule > boundary in the switch context
  - word: lkhjh
    note: '[cell segments] R0+SUF2+SUF0 is underlying st+ap+a; the root s and t swap before the context a p; only segments move, and the root''s boundary closes the group of t, so s lands after that boundary: C# gives R0+SUF2+SUF0|t+?sap+?a.'
    parses:
      - signature: R0_segments+SUF2_segments+SUF0_segments|l+?khj+?h
        rules:
          - SUF2_segments
          - SUF0_segments
          - pr1_segments
    exercises:
      - MetathesisRule > boundary in the switch context
  - word: lkhjj
    note: '[cell segments] R0+SUF2+SUF1 is underlying st+ap+p; the root s and t swap before the context a p; only segments move, and the root''s boundary closes the group of t, so s lands after that boundary: C# gives R0+SUF2+SUF1|t+?sap+?p.'
    parses:
