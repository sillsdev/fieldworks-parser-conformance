    note: '[cell segments] R0+SUF2+SUF0 is underlying st+ap+a; the root s and t swap before the context a p; only segments move, and the root''s boundary closes the group of t, so s lands after that boundary: C# gives R0+SUF2+SUF0|t+?sap+?a.'
    parses:
