language: SpellingCompoundSingletonMedialSuffix
requires: [morpher-settings]
morpher:
  MaxRoots: 3
words:
  - word: apst
    note: "C# returns 3 analyses (X+Y+SUF+Z|apst): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+Y+SUF+Z|apst"
        rules: ["SUF", "cr1", "cr2"]
      - signature: "X+Y+SUF+Z|apst"
        rules: ["SUF", "cr1", "cr2"]
      - signature: "X+Y+SUF+Z|apst"
        rules: ["SUF", "cr1", "cr2"]
    exercises:
      - "CompoundingRule > feeds affixation"
  - word: apt
    note: "C# returns 2 analyses (X+Y+Z|apt): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+Y+Z|apt"
        rules: ["cr1", "cr2"]
      - signature: "X+Y+Z|apt"
        rules: ["cr1", "cr2"]
    exercises:
      - "CompoundingRule > feeds affixation"
  - word: aspt
    note: "C# finds no analysis: pins that this spelling is not a route of the grammar."
    expect_fail: true
    exercises:
      - "CompoundingRule > feeds affixation"
  - word: a
    note: "C# returns 1 analysis (X|a): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X|a"
        rules: []
    exercises:
      - "CompoundingRule > feeds affixation"
  - word: as
    note: "C# returns 1 analysis (X+SUF|as): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+SUF|as"
        rules: ["SUF"]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
  - word: apts
    note: "C# returns 3 analyses (X+Y+Z+SUF|apts): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+Y+Z+SUF|apts"
        rules: ["SUF", "cr1", "cr2"]
      - signature: "X+Y+Z+SUF|apts"
        rules: ["SUF", "cr1", "cr2"]
      - signature: "X+Y+Z+SUF|apts"
        rules: ["SUF", "cr1", "cr2"]
    exercises:
      - "CompoundingRule > feeds affixation"
