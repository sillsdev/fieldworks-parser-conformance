      - signature: "W|[a่]p"
        rules: []
      - signature: "X+Y|[a่]+?p"
        rules: ["cr1"]
        exercises:
          - "CompoundingRule"
      - signature: "X+Y|[a่]+?p"
        rules: ["cr2"]
        exercises:
          - "CompoundingRule"
  - word: "a่p"
