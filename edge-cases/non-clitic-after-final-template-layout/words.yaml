# oracle-provenance: founding-oracle machine-commit=ed5cf05d verified-date=2026-10-26
# Expected parses are derived from the HC clitic and final-template rules (Machine #529); the engine run only confirms them.
# The Morphology stratum is non-blocking, so the final-template state is not cleared when it ends and still bars the ordinary
# rule mrLate in the next stratum (sagdp). The rows sagdp and kolp were added on 2026-11-27 (C# ba6dfa10, hc-conformance --propose);
# clitic-flex-layout-blocking-morphology holds the same grammar with a blocking Morphology stratum, where sagdip parses.
language: NonCliticAfterFinalTemplateLayout
inspired_by: ["synthetic FieldWorks-layout probe: a final template, a non-clitic rule and an enclitic in strata without phonological rules, not a model of a real language"]
sources:
  - "https://github.com/sillsdev/machine/pull/529"
  - "src/SIL.Machine.Morphology.HermitCrab/MorphologicalRules/SynthesisAffixProcessRule.cs"
  - "src/SIL.Machine.Morphology.HermitCrab/Morpher.cs: IsBlockingStratum"
requires: []
words:
  - word: sagd
    note: >-
      The final verb template applied on its own.
    parses:
      - signature: "SAG+PAST|sagd"
        rules: [mrPast]
        exercises: ["Affix template slots (obligatory/disjunctive/ordering)"]

  - word: sagds
    note: >-
      Control: the enclitic is a clitic by stratum name and may follow the final template.
    parses:
      - signature: "SAG+PAST+ENC|sagds"
        rules: [mrPast, mrEnc]
        exercises: ["Clitic rules (Clitics stratum) after a final template"]

  - word: sagdk
    note: >-
      mrDeriv is non-clitic and non-partial, so NonPartialRuleProhibitedAfterFinalTemplate refuses
      it after the final template.
    expect_fail: true
    blocked_by: [mrDeriv]
    exercises: ["Clitic rules (Clitics stratum) after a final template"]

  - word: kolk
    note: >-
      Control: nouns have no template, so no final template has applied and mrDeriv attaches.
    parses:
      - signature: "KOL+DERIV|kolk"
        rules: [mrDeriv]
        exercises: ["Clitic rules (Clitics stratum) after a final template"]

  - word: sagdp
    note: >-
      Control: mrLate is an ordinary, non-partial, non-clitic rule in its own stratum after Morphology. The final template has
      applied and Morphology is non-blocking, so the final-template state is not cleared and mrLate is refused
      (NonPartialRuleProhibitedAfterFinalTemplate). Compare sagdip in clitic-flex-layout-blocking-morphology.
    expect_fail: true
    blocked_by: [mrLate]
    exercises: ["Clitic rules (Clitics stratum) after a final template"]

  - word: kolp
    note: >-
      Control: the same mrLate applies to a stem that did not go through the final template, so the refusal of sagdp is the
      template state and not the stratum.
    parses:
      - signature: "KOL+LATE|kolp"
        rules: [mrLate]
        exercises: ["Affix template slots (obligatory/disjunctive/ordering)"]
