        rules: ["cr2"]
        exercises:
          - "CompoundingRule"
  - word: ap
    note: "C# returns 2 analyses (X+X|ap): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+X|ap"
        rules: ["cr1"]
