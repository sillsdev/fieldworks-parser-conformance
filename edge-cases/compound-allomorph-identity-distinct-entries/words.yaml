      - signature: "X+Y|ppp"
        rules: ["cr2"]
        exercises:
          - "CompoundingRule"
      - signature: "Y+X|ppp"
        rules: ["cr1"]
        exercises:
          - "CompoundingRule"
      - signature: "Y+X|ppp"
        rules: ["cr2"]
