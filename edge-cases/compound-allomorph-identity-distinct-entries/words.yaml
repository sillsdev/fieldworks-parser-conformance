language: CompoundIdentity
requires: []
fieldworks_producible_notes: Fully specified literal segments and ordinary compounding or affix rules; no fwdata round-trip witness is claimed.
words:
  - word: a
    note: "C# returns 1 analysis (X|a): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X|a"
        rules: []
    exercises:
      - "CompoundingRule"
  - word: p
    note: "C# returns 1 analysis (X|p): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X|p"
        rules: []
    exercises:
      - "CompoundingRule"
  - word: pp
    note: "C# returns 3 analyses (X|pp; Y|pp): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X|pp"
        rules: ["cr1"]
        exercises:
          - "CompoundingRule"
      - signature: "X|pp"
        rules: ["cr2"]
        exercises:
          - "CompoundingRule"
      - signature: "Y|pp"
        rules: []
    exercises:
      - "CompoundingRule"
