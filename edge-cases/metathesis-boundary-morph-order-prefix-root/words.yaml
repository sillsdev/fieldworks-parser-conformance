language: MetathesisMorphOrderPrefixRoot
requires: [phonology]
words:
  - word: "p"
    note: >-
      Root p alone: no prefix, so no switch pair exists.
    parses:
      - signature: "Y|p"
        rules: []
    exercises:
      - "MetathesisRule > morph order across the switch"
  - word: "t"
    note: >-
      Root t alone: no prefix, so no switch pair exists.
    parses:
      - signature: "Z|t"
        rules: []
    exercises:
      - "MetathesisRule > morph order across the switch"
  - word: "ts"
    note: >-
      Underlying prefix s then root t with no boundary written: the swap crosses the morph boundary, so the analysis lists the root first (Z+PRE), in surface order.
    parses:
      - signature: "Z+PRE|ts"
        rules: [PRE, pr1]
    exercises:
      - "MetathesisRule > morph order across the switch"
  - word: "sp"
    note: >-
      Prefix s then root p: p is not a switch target, so nothing swaps and the order stays PRE+Y.
    parses:
      - signature: "PRE+Y|sp"
        rules: [PRE]
    exercises:
      - "MetathesisRule > morph order across the switch"
