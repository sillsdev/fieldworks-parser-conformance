# Pins sillsdev/PanGloss#405: a null prefix NU0 (inserts the boundary +) before a root whose first segment a later
# phonological rule (pd0: t -> 0) deletes, with a later suffix SU1 (+a). Roots R0 = tps and R1 = pts both surface as
# ps once pd0 deletes the t. For psa C# gives R0+NU0+SU1 and NU0+R1+SU1 (the null prefix on either side of the
# root in the sequence) as well as the prefixless R0+SU1 and R1+SU1. Every other word of the 1803-word probe space
# has no parse and is pinned as expect_fail.
language: NullPrefixRootInitialDeletionLaterSuffix
inspired_by: ["synthetic probe (not modeling any real language)"]
sources:
  - "sillsdev/PanGloss issue 405: C# analyses a null or inserted segment beside a prefix that a later rule deletes"
  - "FieldWorks HCLoader.LoadAffixProcessRule (prefix and null prefix), HCLoader.LoadRewriteRule (the deletion, epenthesis and change)"
requires: [phonology]
words:
  - word: "ps"
    note: "C# e63b8863 returns 4 analyses (NU0+R0|+?ps ; NU0+R1|+?ps ; R0|ps ; R1|ps): pins the morpheme sequence."
    parses:
      - signature: "NU0+R0|+?ps"
        rules: [NU0, pd0]
        exercises: ["AffixProcessRule: prefix/suffix/circumfix/infix", "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)", "Boundary markers (CharacterDefinitionTable)"]
      - signature: "NU0+R1|+?ps"
        rules: [NU0, pd0]
      - signature: "R0|ps"
        rules: [pd0]
      - signature: "R1|ps"
        rules: [pd0]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
      - "Boundary markers (CharacterDefinitionTable)"
  - word: "psa"
    note: "C# e63b8863 returns 4 analyses (NU0+R1+SU1|+?psa ; R0+NU0+SU1|psa ; R0+SU1|psa ; R1+SU1|psa): pins the morpheme sequence."
    parses:
      - signature: "NU0+R1+SU1|+?psa"
        rules: [NU0, SU1, pd0]
      - signature: "R0+NU0+SU1|psa"
        rules: [NU0, SU1, pd0]
      - signature: "R0+SU1|psa"
        rules: [SU1, pd0]
      - signature: "R1+SU1|psa"
        rules: [SU1, pd0]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
      - "Boundary markers (CharacterDefinitionTable)"
  - word: "+ps"
    note: "C# e63b8863 returns 2 analyses (NU0+R0|+?ps ; NU0+R1|+?ps): pins the morpheme sequence."
    parses:
      - signature: "NU0+R0|+?ps"
        rules: [NU0, pd0]
      - signature: "NU0+R1|+?ps"
        rules: [NU0, pd0]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
      - "Boundary markers (CharacterDefinitionTable)"
  - word: "+psa"
    note: "C# e63b8863 returns 1 analysis (NU0+R1+SU1|+?psa): pins the morpheme sequence."
    parses:
      - signature: "NU0+R1+SU1|+?psa"
        rules: [NU0, SU1, pd0]
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
      - "Boundary markers (CharacterDefinitionTable)"
generated_no_parse:
  - alphabet: [a, p, t, s]
    max_length: 5
    note: "C# e63b8863 returns no analysis: pins that this spelling is not a route."
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
      - "Boundary markers (CharacterDefinitionTable)"
  - alphabet: [a, p, t, s, "+"]
    min_length: 2
    max_length: 4
    note: "C# e63b8863 returns no analysis: pins that this spelling is not a route."
    exercises:
      - "AffixProcessRule: prefix/suffix/circumfix/infix"
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
      - "Boundary markers (CharacterDefinitionTable)"
