# oracle-provenance: sillsdev/machine master 0cbf85f1 with the conformance runner of machine PR 615; rows identical with the partial-rule prune of machine PR for issue 643.
# Partial rules pk (suffix ko) and pc (prefix ka) apply to the stem, and the phonological deletion rule prDel (run with DelReapps 1) removes the o of ko or the a of ka from the surface form. The final template T1 closes the word.
language: PartialRuleDeletedMaterial
inspired_by: ["synthetic partial-rule probe (not modeling any real language)"]
sources:
  - "https://github.com/sillsdev/machine/issues/643"
requires: [phonology, morpher-settings]
fieldworks_producible: true
morpher:
  DelReapps: 1
words:
  - word: lipktr
    note: >-
      Analysis applies the partial rule pk in the derivation.
    parses:
      - signature: "LIP+PK+T+R|lipktr"
        rules: [pk, t, r, prDel]

  - word: lipkt
    note: >-
      Analysis applies the partial rule pk in the derivation.
    parses:
      - signature: "LIP+PK+T|lipkt"
        rules: [pk, t, prDel]

  - word: liptr
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true

  - word: lipkotr
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true

  - word: kaliptr
    note: >-
      Analysis applies the partial rule pc in the derivation.
    parses:
      - signature: "PC+LIP+T+R|kaliptr"
        rules: [pc, t, r]
      - signature: "PC+LIP+T+R|kaliptr"
        rules: [pc, t, r]

  - word: liptkor
    note: >-
      Analysis applies the partial rule pk in the derivation.
    parses:
      - signature: "LIP+T+PK+R|liptkor"
        rules: [t, pk, r]
