#
# Pins a narrowing rule whose input is a vowel, a boundary and a stop carrying an alpha voicing variable (V + [stop alpha-voice] -> V [fricative alpha-voice], three nodes to two); the analysis has to undo the rule by narrowing across the boundary with the variable resolved from the surface fricative.

language: NarrowingBoundaryOrderAlphaLhs
inspired_by: ["synthetic probe for PanGloss#33 (not modeling any real language)"]
sources:
  - "src/SIL.Machine.Morphology.HermitCrab/PhonologicalRules/NarrowAnalysisRewriteRuleSpec.cs"
requires: [phonology]
words:
  - word: aafa
    note: AA+FA (underlying f, boundary survives as an optional marker) and AA+PA (p spirantized after the boundary, alpha-voice kept).
    parses:
      - signature: "AA+FA|aa+?fa"
        rules: [mrFA, prSpirant]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)", "Alpha-variable phonological environments (VariableFeature/AlphaVariables)", "Boundary markers (CharacterDefinitionTable)"]
      - signature: "AA+PA|aafa"
        rules: [mrPA, prSpirant]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side"
  - word: aava
    note: AA+VA and AA+BA (voiced stop spirantizes to the voiced fricative, so the alpha variable carries voicing).
    parses:
      - signature: "AA+VA|aa+?va"
        rules: [mrVA, prSpirant]
      - signature: "AA+BA|aava"
        rules: [mrBA, prSpirant]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side"
  - word: aapa
    note: The rule is obligatory after the boundary, so p never surfaces there.
    expect_fail: true
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side"
  - word: aaba
    note: Same for b.
    expect_fail: true
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > boundary marker in the left-hand side"
