# Pins sillsdev/PanGloss#406: a prefix PR0 inserts t before the root; pe0 epenthesises a beside a t that sits between
# t and s (t _ s), then pd0 deletes t before a. Roots R0 = sa, R1 = sp; suffix SU1 = +s in a later stratum.
# For asas C# gives R0+PR0+SU1 (root, prefix, suffix). Every other word of the 1364-word probe space has no
# parse and is pinned as listed; the no-parse words stay expect_fail.
language: EpenthesisBesidePrefixThenPrefixDeletion
inspired_by: ["synthetic probe (not modeling any real language)"]
sources:
  - "sillsdev/PanGloss issue 406: C# analyses a null or inserted segment beside a prefix that a later rule deletes"
  - "FieldWorks HCLoader.LoadAffixProcessRule (prefix and null prefix), HCLoader.LoadRewriteRule (the deletion, epenthesis and change)"
requires: [phonology]
words:
  - word: "sa"
    note: "C# e63b8863 returns 1 analysis (R0|sa): pins the morpheme sequence."
    parses:
      - signature: "R0|sa"
        rules: []
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "sp"
    note: "C# e63b8863 returns 1 analysis (R1|sp): pins the morpheme sequence."
    parses:
      - signature: "R1|sp"
        rules: []
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "asa"
    note: "C# e63b8863 returns 1 analysis (PR0+R0|asa): pins the morpheme sequence."
    parses:
      - signature: "PR0+R0|asa"
        rules: [PR0, pd0, pe0]
    exercises:
      - "Boundary markers (CharacterDefinitionTable)"
  - word: "asp"
    note: "C# e63b8863 returns 1 analysis (PR0+R1|asp): pins the morpheme sequence."
    parses:
      - signature: "PR0+R1|asp"
        rules: [PR0, pd0, pe0]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "sas"
    note: "C# e63b8863 returns 1 analysis (R0+SU1|sas): pins the morpheme sequence."
    parses:
      - signature: "R0+SU1|sas"
        rules: [SU1]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "sps"
    note: "C# e63b8863 returns 1 analysis (R1+SU1|sps): pins the morpheme sequence."
    parses:
      - signature: "R1+SU1|sps"
        rules: [SU1]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "asas"
    note: "C# e63b8863 returns 1 analysis (R0+PR0+SU1|asas): pins the morpheme sequence."
    parses:
      - signature: "R0+PR0+SU1|asas"
        rules: [PR0, SU1, pd0, pe0]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "asps"
    note: "C# e63b8863 returns 1 analysis (R1+PR0+SU1|asps): pins the morpheme sequence."
    parses:
      - signature: "R1+PR0+SU1|asps"
        rules: [PR0, SU1, pd0, pe0]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
generated_no_parse:
  - alphabet: [a, p, t, s]
    max_length: 5
    note: "C# e63b8863 returns no analysis: pins that this spelling is not a route."
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
