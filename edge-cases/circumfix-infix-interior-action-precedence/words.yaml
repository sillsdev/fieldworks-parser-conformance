language: CircumfixInfixInteriorActionPrecedence
inspired_by:
  - synthetic simultaneously-circumfixing-and-infixing probe (not modeling any real language)
  - synthetic non-first-allomorph circumfix probe (not modeling any real language)
  - synthetic simultaneously-circumfixing-and-reduplicating probe (not modeling any real language)
sources:
  - docs/conformance/circumfix-structural-composite-census.md (census C3)
  - docs/conformance/circumfix-structural-composite-census.md (census C1)
  - docs/conformance/circumfix-structural-composite-census.md (census C2)
requires: []
words:
  - word: bat
    note: '[cell interior-action] ROOT2 bare, no mrCircInfix applied -- a plain control.'
    parses:
      - signature: ROOT2_interior-action|bat
        rules: []
    exercises:
      - 'AffixProcessRule: prefix/suffix/circumfix/infix'
  - word: kebzatan
    note: '[cell interior-action] ROOT2 + mrCircInfix''s one allomorph: "ke" (leading insert) + "b" (Copy p1) + "z" (interior insert -- the infix-shaped part) + "at" (Copy p2) + "an" (trailing insert). Before census C3''s fix, `classify_affix`''s interior-action test saw the "z" insert strictly between the two Copy actions and returned Role::Infix immediately, so this allomorph was routed to `crate::preexpand` -- which cannot represent a root wrapped on both sides at all. After the fix, the leading-AND-trailing test wins, this classifies CircumfixPrefix, and the surface is reachable only via `build_structural_composites`''s oracle-backed resynthesis.'
    provenance: docs/conformance/circumfix-structural-composite-census.md (census C3)
    parses:
      - signature: CIRCINFIX_interior-action+ROOT2_interior-action|kebzatan
        rules:
          - mrCircInfix_interior-action
        exercises:
          - 'AffixProcessRule: prefix/suffix/circumfix/infix'
  - word: jgp
    note: '[cell non-first-allomorph] ROOT bare, no mrMixed applied -- a plain control.'
    parses:
      - signature: ROOT_non-first-allomorph|jgp
        rules: []
    exercises:
      - 'AffixProcessRule: prefix/suffix/circumfix/infix'
  - word: jgpo
    note: '[cell non-first-allomorph] ROOT + mrMixed''s allomorph 0 (subSuffix, an ORDINARY suffix). Alone, this allomorph would classify Role::Suffix -- exercised here to prove the ordinary allomorph still rides along once the rule is admitted (over-inclusion is safe, census''s own "opposite order is safe" observation, just mirrored for the reverse declaration order).'
    provenance: docs/conformance/circumfix-structural-composite-census.md (census C1)
    parses:
      - signature: ROOT_non-first-allomorph+MIXED_non-first-allomorph|jgpo
        rules:
          - mrMixed_non-first-allomorph
        exercises:
          - 'AffixProcessRule: prefix/suffix/circumfix/infix'
  - word: hfjgpdl
    note: '[cell non-first-allomorph] ROOT + mrMixed''s allomorph 1 (subCircum, the CIRCUMFIX -- "ke-...-an" wrapping the root on both sides). Declared SECOND in grammar.xml: before census C1''s fix, `rule_role`''s first-allomorph-only classification never saw this shape at all, so `is_structural_rule` never routed mrMixed through `build_structural_composites` and this exact surface was unreachable from the proposer -- an honest, fail-closed recall gap, not a wrong compile.'
    provenance: docs/conformance/circumfix-structural-composite-census.md (census C1)
    parses:
      - signature: MIXED_non-first-allomorph+ROOT_non-first-allomorph|hfjgpdl
        rules:
          - mrMixed_non-first-allomorph
        exercises:
          - 'AffixProcessRule: prefix/suffix/circumfix/infix'
  - word: àqw
    note: '[cell reduplication] ROOTC2 bare, no mrCircRedup applied -- a plain control.'
    parses:
      - signature: ROOTC2_reduplication|àqw
        rules: []
    exercises:
      - 'AffixProcessRule: prefix/suffix/circumfix/infix'
  - word: vràqwàqwqx
    note: '[cell reduplication] ROOTC2 + mrCircRedup''s one allomorph: "ke" (leading insert) + "tam" (Copy p1, 1st) + "tam" (Copy p1, 2nd -- the reduplication-shaped part) + "an" (trailing insert). Before census C2''s fix, `classify_affix`''s reduplication test ran unconditionally (before first_copy/last_copy were even computed) and returned Role::Reduplication immediately, so this allomorph was routed to `crate::peel::ReduplicationPeeler` -- whose four scan kinds are each a one-sided surface match and cannot recall a surface with independent material wrapping a reduplicated span on BOTH sides. After the fix, the leading-AND-trailing test wins, this classifies CircumfixPrefix, and the surface is reachable via `build_structural_composites`''s oracle-backed resynthesis instead.'
    provenance: docs/conformance/circumfix-structural-composite-census.md (census C2)
    parses:
      - signature: CIRCREDUP_reduplication+ROOTC2_reduplication|vràqwàqwqx
        rules:
          - mrCircRedup_reduplication
    exercises:
      - 'AffixProcessRule: reduplication (ReduplicationHint)'
