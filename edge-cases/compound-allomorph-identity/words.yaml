language: CompoundIdentity
requires: []
fieldworks_producible_notes: Fully specified literal segments and ordinary compounding or affix rules; no fwdata round-trip witness is claimed.
words:
  - word: a
    note: '[cell plain] C# returns 1 analysis (ROOT|a): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: ROOT_plain|a
        rules: []
    exercises:
      - CompoundingRule
  - word: p
