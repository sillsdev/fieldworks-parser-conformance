# Pins the allomorph environment of a morph beside an epenthetic segment after a compounding rule rebuilds the shape (prefix p requires s on its right; roots sa st ta; one rule inserts a between p and s; a compounding rule adds the root t in a later stratum). C# keeps an inserted node at a morph's edge outside every morph's annotation range through the compound's re-marking, so `pasat` has no analysis;
# HC-Rust cleared the bare marks on a compound rebuild and read the node as part of the prefix. Every word of the 1364-word probe space (length 1 to 5 over a p s t) that is not listed with a parse is pinned as expect_fail.
language: EpenthesisBesideMorphThenCompound
inspired_by: ["synthetic probe (not modeling any real language)"]
sources:
  - "C# AnnotationList.cs:131-138 (a node nests only inside a range that contains it), AllomorphEnvironment.cs:88-97"
  - "FieldWorks HCLoader.LoadAffixProcessRule, LoadRewriteRule (epenthesis), LoadCompoundingRule"
requires: [phonology]
words:
  - word: "t"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R3|t"
        rules: []
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "ta"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R2|ta"
        rules: []
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "tt"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R3|tt"
        rules: [CR1]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
  - word: "sa"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R0|sa"
        rules: []
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "st"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R1|st"
        rules: []
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "tat"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R2+R3|tat"
        rules: [CR1]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "sat"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R0+R3|sat"
        rules: [CR1]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "stt"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R1+R3|stt"
        rules: [CR1]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
generated_no_parse:
  - alphabet: [a, p, t, s]
    max_length: 5
    note: "C# e63b8863 returns no analysis: pins that this spelling is not a route."
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
