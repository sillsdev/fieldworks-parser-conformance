language: SpellingCompoundSingletonQuoteBoundary
requires: [morpher-settings]
morpher:
  MaxRoots: 2
words:
  - word: a
    note: "C# returns 1 analysis (X|a): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X|a"
        rules: []
    exercises:
      - "CompoundingRule > boundary marker at the junction"
  - word: ap
    note: "C# returns 2 analyses (X+Y|a[+\"]?p): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+Y|a[+\"]?p"
        rules: ["cr1"]
      - signature: "X+Y|a[+\"]?p"
        rules: ["cr2"]
    exercises:
      - "CompoundingRule > boundary marker at the junction"
  - word: pa
    note: "C# returns 2 analyses (Y+X|p[+\"]?a): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "Y+X|p[+\"]?a"
        rules: ["cr1"]
      - signature: "Y+X|p[+\"]?a"
        rules: ["cr2"]
    exercises:
      - "CompoundingRule > boundary marker at the junction"
  - word: "a+p"
    note: "C# returns 2 analyses (X+Y|a[+\"]?p): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+Y|a[+\"]?p"
        rules: ["cr1"]
      - signature: "X+Y|a[+\"]?p"
        rules: ["cr2"]
    exercises:
      - "CompoundingRule > boundary marker at the junction"
  - word: "a\"p"
    note: "C# returns 2 analyses (X+Y|a[+\"]?p): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+Y|a[+\"]?p"
        rules: ["cr1"]
      - signature: "X+Y|a[+\"]?p"
        rules: ["cr2"]
    exercises:
      - "CompoundingRule > boundary marker at the junction"
  - word: "a\"a"
    note: "C# returns 2 analyses (X|a[+\"]?a): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X|a[+\"]?a"
        rules: ["cr1"]
      - signature: "X|a[+\"]?a"
        rules: ["cr2"]
    exercises:
      - "CompoundingRule > boundary marker at the junction"
  - word: "a\"sp"
    note: "C# returns 1 analysis (X+PRE+Y|a[+\"]?sp): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+PRE+Y|a[+\"]?sp"
        rules: ["PRE", "cr2"]
    exercises:
      - "CompoundingRule > boundary marker at the junction"
  - word: "a\"a\"a"
    note: "C# finds no analysis: pins that this spelling is not a route of the grammar."
    expect_fail: true
    exercises:
      - "CompoundingRule > boundary marker at the junction"
