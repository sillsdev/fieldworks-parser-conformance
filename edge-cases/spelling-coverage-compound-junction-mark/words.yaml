language: SpellingCompoundJunctionMark
requires: [morpher-settings]
morpher:
  MaxRoots: 3
words:
  - word: "aṕ"
    note: "C# returns 2 analyses (X+Y+Z|[aá][+-=]?p[+-=]?[t́]): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+Y+Z|[aá][+-=]?p[+-=]?[t́]"
        rules: ["cr1", "cr2"]
        exercises:
          - "CompoundingRule"
      - signature: "X+Y+Z|[aá][+-=]?p[+-=]?[t́]"
        rules: ["cr1", "cr2"]
        exercises:
          - "CompoundingRule"
    exercises:
      - "CompoundingRule > junction phonology"
  - word: apt
    note: "C# returns 2 analyses (X+Y+Z|[aá][+-=]?p[+-=]?[t́]): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+Y+Z|[aá][+-=]?p[+-=]?[t́]"
        rules: ["cr1", "cr2"]
        exercises:
          - "CompoundingRule"
      - signature: "X+Y+Z|[aá][+-=]?p[+-=]?[t́]"
        rules: ["cr1", "cr2"]
        exercises:
          - "CompoundingRule"
    exercises:
      - "CompoundingRule > junction phonology"
  - word: at
    note: "C# returns 2 analyses (X+Z|[aá][+-=]?[t́]): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+Z|[aá][+-=]?[t́]"
        rules: ["cr1"]
        exercises:
          - "CompoundingRule"
      - signature: "X+Z|[aá][+-=]?[t́]"
        rules: ["cr2"]
        exercises:
          - "CompoundingRule"
    exercises:
      - "CompoundingRule > junction phonology"
  - word: sa
    note: "C# returns 1 analysis (PRE+X|s[aá]): pins that this word has a route and its morpheme sequence."
    parses:
      - signature: "PRE+X|s[aá]"
        rules: ["PRE"]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"