# Pins the deleted-node positions after a metathesis rule swaps beside a deleted node (a boundary prefix, roots R0 and R1, a suffix; a deletion rule, then a swap rule whose switches sit beside the deleted node). C# SynthesisMetathesisRuleSpec.ApplyRhs moves only the two switch groups, so a deleted node keeps its position and `spa` keeps four analyses;
# a Rust port that moves the deleted-node marks with the swap flips both roots. Every word of the 1364-word probe space (length 1 to 5 over a p s t) that is not listed with a parse is pinned as expect_fail.
language: DeletionThenSwap
inspired_by: ["synthetic probe (not modeling any real language)"]
sources:
  - "C# AnnotationList.cs:131-138 (a node nests only inside a range that contains it), SynthesisMetathesisRuleSpec.ApplyRhs"
  - "FieldWorks HCLoader.LoadAffixProcessRule, LoadRewriteRule (deletion), LoadMetathesisRule"
requires: [phonology]
words:
  - word: "sp"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "NU0+R0|+?sp"
        rules: [NU0, pd0, pm]
        exercises: ["MetathesisRule", "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)", "Boundary markers (CharacterDefinitionTable)"]
      - signature: "NU0+R1|+?sp"
        rules: [NU0, pd0, pm]
      - signature: "R0|sp"
        rules: [pd0, pm]
      - signature: "R1|sp"
        rules: [pd0, pm]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
  - word: "spa"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "NU0+R1+SU1|+?spa"
        rules: [NU0, SU1, pd0, pm]
      - signature: "R0+NU0+SU1|spa"
        rules: [NU0, SU1, pd0, pm]
      - signature: "R0+SU1|spa"
        rules: [SU1, pd0, pm]
      - signature: "R1+SU1|spa"
        rules: [SU1, pd0, pm]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
generated_no_parse:
  - alphabet: [a, p, t, s]
    max_length: 5
    note: "C# e63b8863 returns no analysis: pins that this spelling is not a route."
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
