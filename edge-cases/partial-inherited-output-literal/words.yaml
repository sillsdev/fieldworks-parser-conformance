# oracle-provenance: founding-oracle Machine e63b8863d37d3189c2b11fcaf9d43be74962ad70 (hc-conformance self-check, --propose; every signature is what C# returned on 2026-11-19, none taken from PanGloss staging). Rows for isi, izi, ipi and ibi: machine ba6dfa10, 2026-11-27, hc-conformance --propose
language: FeaturelessSegmentClassRewrite
requires: [phonology]
fieldworks_producible_notes: >-
  Single-valued feature structures and an omitted segment feature, as emitted by HCLoader LoadFeatureStruct and LoadNaturalClass. No multi-valued feature specification is used. The rules for isi and izi write a PhRegularRule structural change that is a natural-class context over the segments s and z, which HCLoader reads through LoadPatternNode and TryLoadSimpleContext; p and b carry a voice value and k does not. No fwdata round-trip witness is claimed.
words:
  - word: asa
    note: First output spelling is a positive control.
    parses:
      - signature: "AKA|a[sz]a"
        rules: [prLen]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
  - word: aza
    note: Second output spelling retains the same root identity in pinned C#.
    parses:
      - signature: "AKA|a[sz]a"
        rules: [prLen]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
  - word: aka
    note: Obligatory rewrite prevents the unchanged root from surfacing.
    expect_fail: true
  - word: isi
    note: >-
      The new class output is the segment class {s,z}, whose two members differ only on voice, so the class drops voice and leaves the input's own voice in place. IPI (underlying ipi) parses because p has voice minus, the same as s. IBI does not parse: b has voice plus, so its result is z.
    parses:
      - signature: "IPI|isi"
        rules: [prSibVoiceless]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
  - word: izi
    note: >-
      The other half of the pair. IBI parses because b has voice plus, the same as z. IPI does not parse. The class does not choose a member: it takes the member the input already agrees with. Only a segment with no voice value, the k of aka above, accepts both.
    parses:
      - signature: "IBI|izi"
        rules: [prSibVoiced]
        exercises:
          - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
  - word: ipi
    note: IPI's own underlying shape is not a surface form, because the rule is obligatory between vowels.
    expect_fail: true
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
  - word: ibi
    note: IBI's own underlying shape is not a surface form, because the rule is obligatory between vowels.
    expect_fail: true
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
