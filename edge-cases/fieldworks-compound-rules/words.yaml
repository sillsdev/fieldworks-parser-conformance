language: FieldWorksCompoundRules
inspired_by: ["synthetic FieldWorks compound-rule probe (not modeling any real language)"]
sources:
  - "FieldWorks HCLoader.cs LoadEndoCompoundingRule / LoadExoCompoundingRule"
requires: []
fieldworks_producible_notes: >-
  Read from HCLoader.cs, not witnessed by a project. Each compound rule is what LoadEndoCompoundingRule (HeadLast true and false; the OverridingMsa part of speech becomes outputPartOfSpeech, a null one leaves it out) or LoadExoCompoundingRule (one rule per head choice, ToMsa part of speech as outputPartOfSpeech) writes; NoDefaultCompounding=true means no default rules; a disabled rule is not loaded (the Disabled filter in the compound-rule loop of HCLoader.cs), so it is an absent rule here. Suffixes are derivational affix rules with a required and an output part of speech. No template, no feature, no MPR restriction.
words:
  - word: bago
    note: >-
      Bare stem control (category A, left member of the right-headed rule).
    parses:
      - signature: "BAGO|bago"
        rules: []
  - word: kesu
    note: >-
      Bare stem control (category B, right member of the right-headed rule).
    parses:
      - signature: "KESU|kesu"
        rules: []
  - word: mita
    note: >-
      Bare stem control (category C).
    parses:
      - signature: "MITA|mita"
        rules: []
  - word: lonu
    note: >-
      Bare stem control (category D).
    parses:
      - signature: "LONU|lonu"
        rules: []
  - word: tabe
    note: >-
      Bare stem control (category E).
    parses:
      - signature: "TABE|tabe"
        rules: []
  - word: disi
    note: >-
      Bare stem control (category F).
    parses:
      - signature: "DISI|disi"
        rules: []
  - word: nuka
    note: >-
      Bare stem control (category G).
    parses:
      - signature: "NUKA|nuka"
        rules: []
  - word: gelo
    note: >-
      Bare stem control (category H).
    parses:
      - signature: "GELO|gelo"
        rules: []
  - word: solu
    note: >-
      Bare stem control (category I, left member of the exocentric rule).
    parses:
      - signature: "SOLU|solu"
        rules: []
  - word: tamo
    note: >-
      Bare stem control (category J, right member of the exocentric rule).
    parses:
      - signature: "TAMO|tamo"
        rules: []
  - word: demu
    note: >-
      Bare stem control (category K): its rule is disabled in the FieldWorks project, so the loader leaves it out.
    parses:
      - signature: "DEMU|demu"
        rules: []
  - word: bonu
    note: >-
      Bare stem control (category L): its rule is disabled in the FieldWorks project, so the loader leaves it out.
    parses:
      - signature: "BONU|bonu"
        rules: []
  - word: bagokesu
    note: >-
      Endocentric, HeadLast=true, OverridingMsa with no part of speech: A+B compounds through EndoHeadLast, and has no analysis without that rule.
    parses:
      - signature: "BAGO+KESU|bagokesu"
        rules: ["crE1"]
        exercises:
          - "CompoundingRule"
  - word: kesubago
    note: >-
      EndoHeadLast needs the A member on the left; reversed order has no analysis.
    expect_fail: true
  - word: bagokesure
    note: >-
      EndoHeadLast, no override: the result keeps the head's (right member's) category B, so the B suffix reaches it. The suffix also attaches to the head stem before compounding, so both engines return two identical-signature analyses.
    parses:
      - signature: "BAGO+KESU+SUFB|bagokesure"
        rules: ["crE1", "sufB"]
        exercises:
          - "CompoundingRule"
      - signature: "BAGO+KESU+SUFB|bagokesure"
        rules: ["crE1", "sufB"]
        exercises:
          - "CompoundingRule"
  - word: bagokesupa
    note: >-
      EndoHeadLast, no override: the left (non-head) category A is not the result category, so the A suffix does not reach the compound.
    expect_fail: true
  - word: mitalonu
    note: >-
      Endocentric, HeadLast=false, OverridingMsa with no part of speech: C+D compounds through EndoHeadFirst.
    parses:
      - signature: "MITA+LONU|mitalonu"
        rules: ["crE2"]
        exercises:
          - "CompoundingRule"
  - word: lonumita
    note: >-
      EndoHeadFirst needs the C member on the left; reversed order has no analysis.
    expect_fail: true
  - word: mitalonuvi
    note: >-
      EndoHeadFirst, no override: the result keeps the head's (left member's) category C, so the C suffix reaches the compound.
    parses:
      - signature: "MITA+LONU+SUFC|mitalonuvi"
        rules: ["crE2", "sufC"]
        exercises:
          - "CompoundingRule"
  - word: mitalonuzo
    note: >-
      EndoHeadFirst, no override: the D suffix would have to attach to the non-head member before compounding; both engines return no analysis, so a derived non-head is not accepted while a derived head is (tabedisizu).
    expect_fail: true
  - word: tabedisi
    note: >-
      Endocentric, HeadLast=true, OverridingMsa naming category R: E+F compounds through EndoHeadLastOverride.
    parses:
      - signature: "TABE+DISI|tabedisi"
        rules: ["crE3"]
        exercises:
          - "CompoundingRule"
  - word: disitabe
    note: >-
      EndoHeadLastOverride needs E on the left; reversed order has no analysis.
    expect_fail: true
  - word: tabedisifu
    note: >-
      EndoHeadLastOverride: the override category R is the result, so the R suffix reaches the compound (R is a category no stem has, so only the compound can take it).
    parses:
      - signature: "TABE+DISI+SUFR|tabedisifu"
        rules: ["crE3", "sufR"]
        exercises:
          - "CompoundingRule"
  - word: tabedisizu
    note: >-
      EndoHeadLastOverride: the F suffix attaches to the head stem disi before compounding, not to the compound; pins that a derived head is still a head.
    parses:
      - signature: "TABE+DISI+SUFF|tabedisizu"
        rules: ["sufF", "crE3"]
        exercises:
          - "CompoundingRule"
  - word: nukagelo
    note: >-
      Endocentric, HeadLast=false, OverridingMsa naming category R: G+H compounds through EndoHeadFirstOverride.
    parses:
      - signature: "NUKA+GELO|nukagelo"
        rules: ["crE4"]
        exercises:
          - "CompoundingRule"
  - word: gelonuka
    note: >-
      EndoHeadFirstOverride needs G on the left; reversed order has no analysis.
    expect_fail: true
  - word: nukagelofu
    note: >-
      EndoHeadFirstOverride: the override category R is the result, so the R suffix reaches the compound.
    parses:
      - signature: "NUKA+GELO+SUFR|nukagelofu"
        rules: ["crE4", "sufR"]
        exercises:
          - "CompoundingRule"
  - word: nukagelowa
    note: >-
      EndoHeadFirstOverride: the head's own category G is replaced by R, so the G suffix does not reach the compound.
    expect_fail: true
  - word: solutamo
    note: >-
      Exocentric rule (ToMsa category S): I+J compounds. The loader emits one rule per head choice, so the rows are two analyses with the same signature, one through ExoRightHead (crX1) and one through ExoLeftHead (crX2).
    parses:
      - signature: "SOLU+TAMO|solutamo"
        rules: ["crX1"]
        exercises:
          - "CompoundingRule"
      - signature: "SOLU+TAMO|solutamo"
        rules: ["crX2"]
        exercises:
          - "CompoundingRule"
  - word: tamosolu
    note: >-
      The exocentric rule needs I on the left; reversed order has no analysis.
    expect_fail: true
  - word: solutamohu
    note: >-
      Exocentric: the result takes ToMsa's category S, so the S suffix reaches the compound (S is a category no stem has); again one analysis per head choice.
    parses:
      - signature: "SOLU+TAMO+SUFS|solutamohu"
        rules: ["crX1", "sufS"]
        exercises:
          - "CompoundingRule"
      - signature: "SOLU+TAMO+SUFS|solutamohu"
        rules: ["crX2", "sufS"]
        exercises:
          - "CompoundingRule"
  - word: bagomita
    note: >-
      Negative, category mismatch: A+C matches no rule, and NoDefaultCompounding=true means no default rule fills in; no analysis.
    expect_fail: true
  - word: demubonu
    note: >-
      Negative, disabled rule: K+L would compound if its rule were enabled, but FieldWorks leaves disabled rules out of the grammar and NoDefaultCompounding=true adds no default; no analysis.
    expect_fail: true
  - word: bonudemu
    note: >-
      Negative, disabled rule, reversed order; no analysis.
    expect_fail: true
  - word: bagopa
    note: >-
      Control: the A suffix reaches the bare stem, so the suffix rules work.
    parses:
      - signature: "BAGO+SUFA|bagopa"
        rules: ["sufA"]
  - word: bagore
    note: >-
      Control: the B suffix does not reach an A stem.
    expect_fail: true
