        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
          - "Affix template slots (obligatory/disjunctive/ordering)"
      - signature: "PC+LOP+PK+T+R|kalopkotr"
        rules: [pc, pk, t, r]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
          - "Affix template slots (obligatory/disjunctive/ordering)"
      - signature: "PC+LOP+PK+T+R|kalopkotr"
        rules: [pc, pk, t, r]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
          - "Affix template slots (obligatory/disjunctive/ordering)"
      - signature: "PC+LOP+PK+T+R|kalopkotr"
        rules: [pc, pk, t, r]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
          - "Affix template slots (obligatory/disjunctive/ordering)"

