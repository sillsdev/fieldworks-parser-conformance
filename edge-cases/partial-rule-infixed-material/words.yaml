# oracle-provenance: sillsdev/machine master 0cbf85f1 with the conformance runner of machine PR 615; rows identical with the partial-rule prune of machine PR for issue 643.
# Partial rules pk (suffix ko) and pc (prefix ka) apply to the stem, and the ordinary infix ix (x before the last segment) then splits the partial material. The final template T1 closes the word.
language: PartialRuleInfixedMaterial
inspired_by: ["synthetic partial-rule probe (not modeling any real language)"]
sources:
  - "https://github.com/sillsdev/machine/issues/643"
requires: []
fieldworks_producible: true
words:
  - word: lopkotr
    note: >-
      Analysis applies the partial rule pk in the derivation.
    parses:
      - signature: "LOP+PK+T+R|lopkotr"
        rules: [pk, t, r]

  - word: loptr
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true

  - word: lopkot
    note: >-
      Analysis applies the partial rule pk in the derivation.
    parses:
      - signature: "LOP+PK+T|lopkot"
        rules: [pk, t]

  - word: lopt
    note: >-
      Control: no partial rule is involved.
    parses:
      - signature: "LOP+T|lopt"
        rules: [t]

  - word: lopktr
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true

  - word: lopotr
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true

  - word: loptkor
    note: >-
      Analysis applies the partial rule pk in the derivation.
    parses:
      - signature: "LOP+T+PK+R|loptkor"
        rules: [t, pk, r]

  - word: lopkotkor
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true

  - word: kaloptr
    note: >-
      Analysis applies the partial rule pc in the derivation.
    parses:
      - signature: "PC+LOP+T+R|kaloptr"
        rules: [pc, t, r]
      - signature: "PC+LOP+T+R|kaloptr"
        rules: [pc, t, r]

  - word: kalopkotr
    note: >-
      Analysis applies the partial rules pc, pk in the derivation.
    parses:
      - signature: "PC+LOP+PK+T+R|kalopkotr"
        rules: [pc, pk, t, r]
      - signature: "PC+LOP+PK+T+R|kalopkotr"
        rules: [pc, pk, t, r]
      - signature: "PC+LOP+PK+T+R|kalopkotr"
        rules: [pc, pk, t, r]
      - signature: "PC+LOP+PK+T+R|kalopkotr"
        rules: [pc, pk, t, r]

  - word: loptrko
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true

  - word: loptkr
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true

  - word: lopkor
    note: >-
      Analysis applies the partial rule pk in the derivation.
    parses:
      - signature: "LOP+PK+R|lopkor"
        rules: [pk, r]

  - word: lopkxotr
    note: >-
      Analysis applies the partial rule pk in the derivation.
    parses:
      - signature: "LOP+PK+IX+T+R|lopkxotr"
        rules: [pk, ix, t, r]

  - word: lopkxot
    note: >-
      Analysis applies the partial rule pk in the derivation.
    parses:
      - signature: "LOP+PK+IX+T|lopkxot"
        rules: [pk, ix, t]

  - word: loxptr
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true

  - word: lopxtr
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true

  - word: kalxoptr
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true

  - word: lopkxoxtr
    note: >-
      No analysis: no sequence of the grammar's rules builds this string.
    expect_fail: true
