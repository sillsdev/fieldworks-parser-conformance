# Pins the allomorph environment of a morph beside an epenthetic segment (prefix p requires s on its right; roots sa st ta; one rule inserts a between p and s; a suffix t joins in a later stratum). C# reads a morph's environment from its
# annotation range, which never holds a node inserted at its edge, so `pasat` has no analysis; HC-Rust accepted it because the inserted segment sat inside the
# neighbouring morph's span. Every word of the 1364-word probe space (length 1 to 5 over a p s t) that is not listed with a parse is pinned as expect_fail.
language: EpenthesisBesideMorphEnvironment
inspired_by: ["synthetic probe (not modeling any real language)"]
sources:
  - "sillsdev/PanGloss issue 405 follow-up: C# AllomorphEnvironment.IsMatch reads morph.Range.End.Next / Start.Prev"
  - "FieldWorks HCLoader.LoadAffixProcessRule (prefix, suffix and environments), HCLoader.LoadRewriteRule (epenthesis)"
requires: [phonology]
words:
  - word: "ta"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R2|ta"
        rules: []
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "sa"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R0|sa"
        rules: []
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "st"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R1|st"
        rules: []
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "tat"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R2+SU1|tat"
        rules: [SU1]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
  - word: "sat"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R0+SU1|sat"
        rules: [SU1]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
  - word: "stt"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R1+SU1|stt"
        rules: [SU1]
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
generated_no_parse:
  - alphabet: [a, p, t, s]
    max_length: 5
    note: "C# e63b8863 returns no analysis: pins that this spelling is not a route."
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > interaction with an affix rule"
