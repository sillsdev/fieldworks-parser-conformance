language: RecursiveEndocentricCompounding
inspired_by: ["synthetic recursive/self-feeding endocentric compounding probe (not modeling any real language)"]
sources:
  - "docs/conformance/representative-typology-basis.md S1.2.1 (Compounding: recursive/self-feeding configuration)"
requires: []
words:
  - word: tevi
    note: ROOT1 bare root, no compounding -- a plain control.
    parses:
      - signature: "ROOT1|tevi"
        rules: []
    exercises:
      - "CompoundingRule > recursion"

  - word: mafl
    note: ROOT2 bare root -- a plain control.
    parses:
      - signature: "ROOT2|mafl"
        rules: []
    exercises:
      - "CompoundingRule > recursion"

  - word: isra
    note: ROOT3 bare root -- a plain control.
    parses:
      - signature: "ROOT3|isra"
        rules: []
    exercises:
      - "CompoundingRule > recursion"

  - word: tevimafl
    note: >-
      ROOT1(head)+ROOT2(nonhead) via ONE application of cr1 -- the ordinary, already-representative
      "compounding.non-recursive" shape (see `conformance-staging/edge-cases/
      compounding-non-recursive`): cr1's own headPartsOfSpeech/nonHeadPartsOfSpeech/
      outputPartOfSpeech all name "posRoot" (the self-feeding-CAPABLE PoS configuration this fixture
      is about), but a SINGLE application never actually exercises the recursion -- included here
      to prove the rule still works normally at depth 1 before the depth-2 negative witness below.
    provenance: "docs/conformance/representative-typology-basis.md S1.2.1"
    parses:
      - signature: "ROOT1+ROOT2|tevimafl"
        rules: [cr1]
    exercises:
      - "CompoundingRule > recursion"

  - word: maflisra
    note: ROOT2(head)+ROOT3(nonhead) via one application of cr1 -- a second depth-1 positive control (different root pair, same shape as tevimafl).
    provenance: "docs/conformance/representative-typology-basis.md S1.2.1"
    parses:
      - signature: "ROOT2+ROOT3|maflisra"
        rules: [cr1]
    exercises:
      - "CompoundingRule > recursion"

  - word: tevimaflisra
    note: >-
      THE recursive/self-feeding witness: ROOT1+ROOT2 (cr1's own first application, forming a
      posRoot-headed compound) then re-entering cr1's own head/non-head search a SECOND time with
      ROOT3 -- (ROOT1+ROOT2)+ROOT3, the "compound's own output PoS re-enters its own input PoS" shape.
      cr1's multipleApplication="9" would allow it, but the word has zero analyses because the default
      stem-count limit (MaxStemCount, 2) is a separate resource ceiling: at most one non-head may be split
      off, so a word is de-compounded once and never recursively re-compounded. The refusal is therefore
      attributed to that limit, not to cr1's application cap (compound-max-applications pins the cap).
      It is the fixture's load-bearing REFUSAL pin of the current behaviour, not a design goal.
      The blocked_by entry below is kept as recorded; see fieldworks-parser-conformance#8.
    provenance: "stem-count limit (MaxStemCount default 2), PROTOCOL.md section 8"
    expect_fail: true
    blocked_by: [cr1]
    exercises:
      - "CompoundingRule > recursion"
