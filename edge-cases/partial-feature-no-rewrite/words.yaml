language: FeaturelessSegmentClassRewrite
requires: []
fieldworks_producible_notes: >-
  Adds one unused symbolic phonological feature to the existing featureless
  segment-class rewrite fixture. Segments carry no values for it. This is the
  partial-feature grammar shape supported by ADR 0009; no fwdata witness is claimed.
words:
  - word: aka
    note: Both roots unify with the underspecified output shape.
    parses:
      - signature: "AKA|[ktszai][ktszai][ktszai]"
        rules: []
        exercises:
          - "NaturalClass: Segments vs FeatureNaturalClass/SegmentNaturalClass precision"
      - signature: "ITA|[ktszai][ktszai][ktszai]"
        rules: []
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > partial feature specification"
  - word: aa
    note: Length control has no three-segment lexical root.
    expect_fail: true
    exercises:
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"
      - "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge) > partial feature specification"
