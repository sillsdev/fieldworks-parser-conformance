language: SpellingCompoundBoundaryExplicit
requires: []
fieldworks_producible_notes: Fully specified literal segments with partial-feature aliases and ordinary non-recursive compounding or affix rules; no fwdata round-trip witness is claimed.
words:
  - word: a
    note: "C# returns 1 analysis (ROOT|[aá(xy)ei]): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "ROOT|[aá(xy)ei]"
        rules: []
    exercises:
      - "CompoundingRule"
      - "CompoundingRule > boundary marker at the junction"
