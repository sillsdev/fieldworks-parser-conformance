# Pins sillsdev/PanGloss#406 with one more rule than epenthesis-beside-prefix-then-prefix-deletion: pc0 (p -> t)
# runs before pe0 (epenthesis of a between t and s) and pd0 (t deleted before a), and the prefix PR0 inserts p.
# Roots R0 = sa, R1 = sp, suffix SU1 = +s. For asas C# gives R0+PR0+SU1. The remaining words of the 1364-word
# probe space have no parse and stay expect_fail.
language: ChangeEpenthesisPrefixDeletionChain
inspired_by: ["synthetic probe (not modeling any real language)"]
sources:
  - "sillsdev/PanGloss issue 406: C# analyses a null or inserted segment beside a prefix that a later rule deletes"
  - "FieldWorks HCLoader.LoadAffixProcessRule (prefix and null prefix), HCLoader.LoadRewriteRule (the deletion, epenthesis and change)"
requires: [phonology]
words:
  - word: "sa"
    note: "C# e63b8863 returns 1 analysis (R0|sa): pins the morpheme sequence."
    parses:
      - signature: "R0|sa"
        rules: []
  - word: "st"
    note: "C# e63b8863 returns 1 analysis (R1|st): pins the morpheme sequence."
    parses:
      - signature: "R1|st"
        rules: [pc0]
        exercises: ["AffixProcessRule: prefix/suffix/circumfix/infix", "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
  - word: "asa"
    note: "C# e63b8863 returns 1 analysis (PR0+R0|asa): pins the morpheme sequence."
    parses:
      - signature: "PR0+R0|asa"
        rules: [PR0, pc0, pd0, pe0]
  - word: "ast"
    note: "C# e63b8863 returns 1 analysis (PR0+R1|ast): pins the morpheme sequence."
    parses:
      - signature: "PR0+R1|ast"
        rules: [PR0, pc0, pd0, pe0]
  - word: "sas"
    note: "C# e63b8863 returns 1 analysis (R0+SU1|sas): pins the morpheme sequence."
    parses:
      - signature: "R0+SU1|sas"
        rules: [SU1]
  - word: "sts"
    note: "C# e63b8863 returns 1 analysis (R1+SU1|sts): pins the morpheme sequence."
    parses:
      - signature: "R1+SU1|sts"
        rules: [SU1, pc0]
  - word: "asas"
    note: "C# e63b8863 returns 1 analysis (R0+PR0+SU1|asas): pins the morpheme sequence."
    parses:
      - signature: "R0+PR0+SU1|asas"
        rules: [PR0, SU1, pc0, pd0, pe0]
  - word: "asts"
    note: "C# e63b8863 returns 1 analysis (R1+PR0+SU1|asts): pins the morpheme sequence."
    parses:
      - signature: "R1+PR0+SU1|asts"
        rules: [PR0, SU1, pc0, pd0, pe0]
generated_no_parse:
  - alphabet: [a, p, t, s]
    max_length: 5
    note: "C# e63b8863 returns no analysis: pins that this spelling is not a route."
