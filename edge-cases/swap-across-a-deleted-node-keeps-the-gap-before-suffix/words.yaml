# Pins swap across a deleted node keeps the gap before suffix (a boundary prefix, roots R0 and R1, a suffix; a deletion rule, then a swap rule whose switches sit on both sides of the deleted node). C# SynthesisMetathesisRuleSpec.ApplyRhs moves only the two switch groups, so a deleted node between them keeps its position; `+paa` is the probe word.
# a Rust port that moves the deleted-node marks with the swap puts the null prefix in the wrong place. Every word of the 1803-word probe space that is not listed with a parse is pinned as expect_fail.
language: DeletionBetweenSwitches
inspired_by: ["synthetic probe (not modeling any real language)"]
sources:
  - "C# SynthesisMetathesisRuleSpec.ApplyRhs, AnnotationList.cs:131-138"
  - "FieldWorks HCLoader.LoadAffixProcessRule, LoadRewriteRule (deletion), LoadMetathesisRule"
requires: [phonology]
words:
  - word: "pa"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "NU0+R1|+?pa"
        rules: [NU0, pd0, pm0]
        exercises: ["MetathesisRule", "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)", "Boundary markers (CharacterDefinitionTable)"]
      - signature: "R1|pa"
        rules: [pd0, pm0]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
  - word: "paa"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "NU0+R1+SU1|+?paa"
        rules: [NU0, SU1, pd0, pm0]
      - signature: "R1+SU1|paa"
        rules: [SU1, pd0, pm0]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
  - word: "pas"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "NU0+R0|+?pas"
        rules: [NU0, pd0, pm0]
      - signature: "R0|pas"
        rules: [pd0, pm0]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
  - word: "pasa"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "NU0+R0+SU1|+?pasa"
        rules: [NU0, SU1, pd0, pm0]
      - signature: "R0+SU1|pasa"
        rules: [SU1, pd0, pm0]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
  - word: "+pa"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "NU0+R1|+?pa"
        rules: [NU0, pd0, pm0]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
  - word: "+paa"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "NU0+R1+SU1|+?paa"
        rules: [NU0, SU1, pd0, pm0]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
  - word: "+pas"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "NU0+R0|+?pas"
        rules: [NU0, pd0, pm0]
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
generated_no_parse:
  - alphabet: [a, p, t, s]
    max_length: 5
    note: "C# e63b8863 returns no analysis: pins that this spelling is not a route."
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
  - alphabet: [a, p, t, s, "+"]
    min_length: 2
    max_length: 4
    note: "C# e63b8863 returns no analysis: pins that this spelling is not a route."
    exercises:
      - "MetathesisRule"
      - "MetathesisRule > interaction with a rewrite rule"
