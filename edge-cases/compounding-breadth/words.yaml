# Compounding breadth. See grammar.xml's header.
#
# Oracle: the C# founding oracle (conformance/adapters/hc-dotnet-wrapper.sh batch over a Debug build
# of src/SIL.Machine.Morphology.HermitCrab.Tool). Every signature is transcribed from that run.
#
# One discriminating negative control and one severance witness:
#   kaptu  CompoundingRule@isActive="no" on crDecoy, which would join with a "p".
#   katumi CompoundingRule.outputPartOfSpeech read by a later rule's requiredPartsOfSpeech.
#
# CONVERSION HISTORY. A compound rule's head and non-head requirements in HCLoader are the part of speech
# and the production restrictions only (LoadEndoCompoundingRule 1891-1961, LoadExoCompoundingRule 1971-2050;
# neither reads a head feature). This fixture used to hold HeadRequiredHeadFeatures and
# NonHeadRequiredHeadFeatures on crJoin, with number=sg/pl on the roots and the negative controls "kaki"
# (a plural-required non-head that was singular) and "kutu" (a singular-required head that was plural).
# FieldWorks cannot write either requirement, so a FieldWorks project would parse both words; the two rows,
# the number feature and the two entries "ki" and "ku" are removed outright rather than kept in an engine-only
# fixture. It also carried a seventh control, "kaitu", isolating CompoundingSubrule@isActive="no" on a rule
# (crJoinInsert) built solely to host that one inactive subrule. HCLoader's compounding-rule loaders
# always synthesize exactly one CompoundingSubrule per CompoundingRule directly from the LibLCM compound
# rule's own MSAs, with no per-subrule Disabled/isActive filter at all, so crJoinInsert/kaitu was removed
# outright rather than converted. Foot features (words kati and patu, the foot-feature entries eTi and
# ePa) and the zero-cap rule crNever (word kamtu) were removed in a later pass: HCLoader never writes a
# foot feature (README row 19), and FieldWorks accepts a compound-rule cap of 1 to 9 only
# (HCMaxCompoundRulesDlg, EnforceValidValue 1 to 9).
#
# COVERAGE LOST, NAMED PLAINLY: CompoundingSubrule@isActive="no" (per-subrule deactivation) is no
# longer exercised by ANY fixture in this corpus, producible or not. CompoundingRule@isActive="no"
# itself (crDecoy, above) stays covered by kaptu. HeadRequiredHeadFeatures and NonHeadRequiredHeadFeatures
# are no longer exercised either: they are unproducible (README row 24).

language: CompoundingBreadth
inspired_by: ["synthetic compounding-constraint probe (not modeling any real language)"]
sources:
  - "conformance/semantic-coverage-baseline.txt compounding todo entries"
requires: [morpher-settings]
fieldworks_producible: true
morpher:
  MaxRoots: 2
words:
  - word: ka
    note: A bare noun root.
    parses:
      - signature: "KA|ka"
        rules: []
        exercises:
          - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"

  - word: tu
    note: A second bare noun root.
    parses:
      - signature: "TU|tu"
        rules: []
        exercises:
          - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"

  - word: katu
    note: >-
      The compound crJoin admits: a noun head and a noun non-head.
    parses:
      - signature: "KA+TU|katu"
        rules: [crJoin]
        exercises:
          - "CompoundingRule"

  - word: katumi
    note: >-
      THE distinguishing row for CompoundingRule.outputPartOfSpeech->MorphologicalRule.requiredPartsOfSpeech:
      KA+TU compounded (crJoin, outputPartOfSpeech="posOther") then attempting mrTplSuf ("-mi") --
      mrTplSuf requires posN, and crJoin's compound is posOther, a genuine CONFLICT, so mrTplSuf can
      never apply to it. This is NOT a vacuous-absence trick (SynthesisCompoundingRule.cs seeds the
      output's syntactic features from the HEAD's own required POS -- posN here -- before
      outputPartOfSpeech's PriorityUnion overwrites it, so a compound's result is never actually
      "unset"): removing crJoin's own outputPartOfSpeech (the writer) lets that seeded posN survive
      unoverwritten, which is EXACTLY what mrTplSuf requires, so it applies. Removing mrTplSuf's own
      requiredPartsOfSpeech (the reader) instead lets it apply regardless of part of speech. Either
      severance reaches the identical successful parse independently. katu (above) is the control
      showing the compound is otherwise well-formed without mrTplSuf.
    expect_fail: true
    blocked_by: [crJoin]
    exercises:
      - "CompoundingRule"
    claims:
      - cell: "PartOfSpeech::CompoundingRule.outputPartOfSpeech->MorphologicalRule.requiredPartsOfSpeech::McDc:AbsentGatedForm"
        severing: >-
          either crJoin's own CompoundingRule.outputPartOfSpeech="posOther" (the writer) or
          mrTplSuf's own MorphologicalRule.requiredPartsOfSpeech="posN" gate (the reader) -- severing
          either alone unblocks this word
        before: "ok::-"
        after: "ok::KA+TU+TPLSUF|katumi"
        distinct_from: katu
        proof: >-
          katumi is KA+TU (crJoin's compound, tagged posOther) attempting mrTplSuf; with both
          constructs intact the part-of-speech conflict (posOther vs. mrTplSuf's own required posN)
          blocks it, so this has zero parses. Removing either the writer (crJoin's own
          outputPartOfSpeech, so the compound's output keeps the head's own seeded posN instead of
          being overwritten to posOther) or the reader (mrTplSuf's requiredPartsOfSpeech) lets the
          rule apply anyway, producing KA+TU+TPLSUF|katumi -- the AbsentGatedForm arm: the required
          part of speech is ABSENT (overwritten away, though never from KA's own declaration) and the
          rule's requirement GATES on it.

  - word: kaptu
    note: Negative control for CompoundingRule@isActive="no". crDecoy would join with a "p".
    expect_fail: true
    blocked_by: [crDecoy]
    neutralizes:
      - crDecoy
    exercises:
      - "Element deactivation (isActive) across loader collections"

# Named-run expectations observed from the C# engine, 2026-10-22, DOP 1. Each run starts from engine defaults and sets only its own morpher block.
variants:
- name: one-root
  morpher:
    MaxRoots: 1
  words:
  - word: ka
    parses:
    - signature: KA|ka
      rules: []
    note: C# oracle observation with MaxRoots = 1.
  - word: tu
    parses:
    - signature: TU|tu
      rules: []
    note: C# oracle observation with MaxRoots = 1.
  - word: katu
    expect_fail: true
    note: C# oracle observation with MaxRoots = 1.
  - word: katumi
    expect_fail: true
    note: C# oracle observation with MaxRoots = 1.
  - word: kaptu
    expect_fail: true
    note: C# oracle observation with MaxRoots = 1.
- name: two-roots
  morpher:
    MaxRoots: 2
  words:
  - word: ka
    parses:
    - signature: KA|ka
      rules: []
    note: C# oracle observation with MaxRoots = 2.
  - word: tu
    parses:
    - signature: TU|tu
      rules: []
    note: C# oracle observation with MaxRoots = 2.
  - word: katu
    parses:
    - signature: KA+TU|katu
      rules:
      - crJoin
    note: C# oracle observation with MaxRoots = 2.
  - word: katumi
    expect_fail: true
    note: C# oracle observation with MaxRoots = 2.
  - word: kaptu
    expect_fail: true
    note: C# oracle observation with MaxRoots = 2.
