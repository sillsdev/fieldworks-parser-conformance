language: SpellingCompoundSingletonBoundary
requires:
  - morpher-settings
morpher:
  MaxRoots: 2
fieldworks_producible_notes: Fully specified literal segments with partial-feature aliases and ordinary non-recursive compounding or affix rules; no fwdata round-trip witness is claimed.
