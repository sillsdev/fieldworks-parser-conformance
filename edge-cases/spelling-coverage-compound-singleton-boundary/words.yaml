  - word: ่j#h#j
    note: '[cell thai-mark] C# finds no analysis: pins that this spelling is not a route of the grammar.'
    expect_fail: true
    exercises:
      - CompoundingRule
  - word: kh
    note: '[cell thai-mark] C# returns 1 analysis (PRE+X|s[a่]): pins that this word has a route and its morpheme sequence.'
    parses:
      - signature: PRE_thai-mark+X_thai-mark|k[h่]
