    exercises:
      - CompoundingRule > boundary marker at the junction
  - word: h
    note: '[cell thai-mark] C# returns 1 analysis (X|[a่]): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_thai-mark|[h่]
        rules: []
    exercises:
      - CompoundingRule
  - word: ่j
