language: SpellingCompoundSingletonBoundary
requires:
  - morpher-settings
morpher:
  MaxRoots: 2
words:
  - word: a+a
    note: '[cell boundary] C# returns 2 analyses (X|a+?a): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_boundary|a+?a
        rules:
          - cr1_boundary
      - signature: X_boundary|a+?a
        rules:
          - cr2_boundary
    exercises:
      - CompoundingRule > boundary marker at the junction
  - word: a+p
    note: '[cell boundary] C# returns 2 analyses (X+Y|a+?p): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_boundary+Y_boundary|a+?p
        rules:
          - cr1_boundary
      - signature: X_boundary+Y_boundary|a+?p
        rules:
          - cr2_boundary
    exercises:
      - CompoundingRule > boundary marker at the junction
  - word: p+a
    note: '[cell boundary] C# returns 2 analyses (Y+X|p+?a): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: Y_boundary+X_boundary|p+?a
        rules:
          - cr1_boundary
      - signature: Y_boundary+X_boundary|p+?a
        rules:
          - cr2_boundary
    exercises:
      - CompoundingRule > boundary marker at the junction
  - word: p+p
    note: '[cell boundary] C# returns 2 analyses (Y|p+?p): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: Y_boundary|p+?p
        rules:
          - cr1_boundary
      - signature: Y_boundary|p+?p
        rules:
          - cr2_boundary
    exercises:
      - CompoundingRule > boundary marker at the junction
  - word: a+sa
    note: '[cell boundary] C# returns 1 analysis (X+PRE|a+?sa): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_boundary+PRE_boundary|a+?sa
        rules:
          - PRE_boundary
          - cr2_boundary
    exercises:
      - CompoundingRule > boundary marker at the junction
  - word: a+sp
    note: '[cell boundary] C# returns 1 analysis (X+PRE+Y|a+?sp): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_boundary+PRE_boundary+Y_boundary|a+?sp
        rules:
          - PRE_boundary
          - cr2_boundary
    exercises:
      - CompoundingRule > boundary marker at the junction
  - word: a+a+a
    note: '[cell boundary] C# finds no analysis: pins that this spelling is not a route of the grammar.'
    expect_fail: true
    exercises:
      - CompoundingRule > boundary marker at the junction
  - word: ap
    note: '[cell boundary] C# returns 2 analyses (X+Y|a+?p): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_boundary+Y_boundary|a+?p
        rules:
          - cr1_boundary
      - signature: X_boundary+Y_boundary|a+?p
        rules:
          - cr2_boundary
    exercises:
      - CompoundingRule > boundary marker at the junction
  - word: b
    note: '[cell quote-boundary] C# returns 1 analysis (X|a): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_quote-boundary|b
        rules: []
    exercises:
      - CompoundingRule > boundary marker at the junction
  - word: bd
    note: '[cell quote-boundary] C# returns 2 analyses (X+Y|a[+"]?p): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_quote-boundary+Y_quote-boundary|b[~"]?d
        rules:
          - cr1_quote-boundary
      - signature: X_quote-boundary+Y_quote-boundary|b[~"]?d
        rules:
          - cr2_quote-boundary
    exercises:
      - CompoundingRule > boundary marker at the junction
  - word: db
