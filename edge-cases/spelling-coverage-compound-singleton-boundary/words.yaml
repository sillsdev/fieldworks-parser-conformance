  - word: j่j
    note: '[cell thai-mark] C# returns 2 analyses (Y+W|p+?[a่]p): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: Y_thai-mark+W_thai-mark|j#?[h่]j
