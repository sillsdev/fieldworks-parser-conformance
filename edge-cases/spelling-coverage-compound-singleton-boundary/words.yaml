    parses:
      - signature: X_boundary_singleton-boundary|a+?a
        rules:
          - cr1_boundary_singleton-boundary
      - signature: X_boundary_singleton-boundary|a+?a
        rules:
          - cr2_boundary_singleton-boundary
    exercises:
      - CompoundingRule > boundary marker at the junction
