language: SpellingCompoundSingletonBoundary
requires:
  - phonology
  - morpher-settings
morpher:
  MaxRoots: 2
words:
  - word: a
    note: '[cell deletion] C# returns 1 analysis (X|a): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: X_deletion|a
        rules: []
    exercises:
      - CompoundingRule > junction phonology
  - word: p
    note: '[cell deletion] C# returns 3 analyses (Y|p; Z+Y|+?p): pins that this spelling is a route and its morpheme sequence.'
    parses:
      - signature: Y_deletion|p
        rules:
          - pr1_deletion
      - signature: Z_deletion+Y_deletion|+?p
        rules:
          - cr1_deletion
          - pr1_deletion
      - signature: Z_deletion+Y_deletion|+?p
        rules:
          - cr2_deletion
          - pr1_deletion
    exercises:
      - CompoundingRule > junction phonology
