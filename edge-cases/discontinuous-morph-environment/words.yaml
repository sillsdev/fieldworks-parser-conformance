# oracle-provenance: machine-pr=sillsdev/machine#631 machine-commit=787d7600 verified-date=2026-11-11
# zuexbu and zuixdu were taken from hc.dll built from machine PR 631 (head 787d7600, with the conformance runner
# of PR 615), not from master; master rejects both. See README.md.
language: DiscontinuousMorphEnvironment
inspired_by: ["synthetic allomorph environment and infixation probe (not modeling any real language)"]
sources:
  - "Allomorph.IsWordValid contiguous-piece validation, Allomorph.cs:110-125"
  - "sillsdev/machine issue 630 and PR 631: the environment is tested around the whole root span"
requires: []
# FieldWorks verdict relies on the task-provided HCLoader.cs facts; that external source is not in
# this worktree. MoStemAllomorph.PhoneEnvRC and MoAffixAllomorph.PositionRS cover these constructs.
fieldworks_producible: true
words:
  - word: dom
    note: Unrestricted bare control root; no infix and no environment constraint.
    parses:
      - signature: "CTRL|dom"
        gloss: control
        rules: []
  - word: zabu
    note: The constrained root plus the suffix supplies u immediately to the right of the root's single piece.
    parses:
      - signature: "GOOD+SUFG|zabu"
        gloss: good-root-u
        rules: [mrSuffixGood]
  - word: zuaubu
    note: The good infix splits the root into three pieces; u follows each piece and the suffix puts u after the last, so the environment holds around the whole span (and at every piece).
    parses:
      - signature: "GOOD+GINF+SUFG|zuaubu"
        gloss: good-root-infixed-u
        rules: [mrGoodInfix, mrSuffixGood]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
  - word: zuexbu
    note: >-
      Whole-span reading: the root zeb is split by the bad infix into z, e and b with u and x between them,
      and its environment (a following u) is tested once, to the right of the last root piece, where the
      suffix supplies u. The x after the middle piece is an infix segment inside the word, not a
      neighbour of the root. A per-piece check would reject this word (the middle piece is followed by x).
    parses:
      - signature: "BADONE+BINF+SUFB|zuexbu"
        rules: [mrBadInfix, mrSuffixBad]

  - word: zuixdu
    note: >-
      Like zuexbu on an independent root (zid): the environment holds at the right edge of the whole
      split root, so the word parses, and a per-piece check would reject it.
    parses:
      - signature: "BADTWO+BINF+SUFB|zuixdu"
        rules: [mrBadInfix, mrSuffixBad]
