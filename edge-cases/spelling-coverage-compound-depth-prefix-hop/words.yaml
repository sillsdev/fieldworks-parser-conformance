language: SpellingCompoundDepthPrefixHop
requires: [morpher-settings]
morpher:
  MaxRoots: 4
words:
  - word: aasp
    note: "C# returns 1 analysis (X+PRE+Y|[aá][+-=]?[aá][+-=]?sp): pins that this spelling is a route and its morpheme sequence."
    parses:
      - signature: "X+PRE+Y|[aá][+-=]?[aá][+-=]?sp"
        rules: ["PRE", "cr2"]
        exercises:
          - "AffixProcessRule: prefix/suffix/circumfix/infix"
          - "CompoundingRule"
          - "CompoundingRule constraints (MaxApplicationCount/Blockable/head-nonhead syntactic features)"
  - word: aaasp
    note: "C# returns 1 analysis (X+PRE+Y|[aá][+-=]?[aá][+-=]?[aá][+-=]?sp): pins that this spelling is a route and its morpheme sequence."
