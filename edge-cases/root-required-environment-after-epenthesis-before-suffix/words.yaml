# Pins the allomorph environment of a morph beside an epenthetic segment (roots ap tp ta with suffix s; the rule inserts a between p and s). C# reads a morph's environment from its
# annotation range, which never holds a node inserted at its edge, so `apas` has no analysis; HC-Rust accepted it because the inserted segment sat inside the
# neighbouring morph's span. Every word of the 340-word probe space (length 1 to 4 over a p s t) that is not listed with a parse is pinned as expect_fail.
language: EpenthesisBesideMorphEnvironment
inspired_by: ["synthetic probe (not modeling any real language)"]
sources:
  - "sillsdev/PanGloss issue 405 follow-up: C# AllomorphEnvironment.IsMatch reads morph.Range.End.Next / Start.Prev"
  - "FieldWorks HCLoader.LoadAffixProcessRule (prefix, suffix and environments), HCLoader.LoadRewriteRule (epenthesis)"
requires: [phonology]
words:
  - word: "ta"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R2|ta"
        rules: []
  - word: "tp"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R1|tp"
        rules: []
  - word: "tas"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R2+SU0|tas"
        rules: [SU0]
        exercises: ["AffixProcessRule: prefix/suffix/circumfix/infix", "RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
  - word: "tpas"
    note: "C# e63b8863 returns this analysis."
    parses:
      - signature: "R1+SU0|tpas"
        rules: [SU0, pe0]
generated_no_parse:
  - alphabet: [a, p, t, s]
    max_length: 4
    note: "C# e63b8863 returns no analysis: pins that this spelling is not a route."
