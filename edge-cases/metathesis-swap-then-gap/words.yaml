# Reference defect sillsdev/machine#649 (open; divergence 132; tracked in status.yaml): analysis un-applies the deletion pd0 first and
# restores an optional t between the switches of pm0, so the optional t joins the first switch's capture and
# AnalysisMetathesisRuleSpec pairs the captures node by node: the swap is never undone and no root matches. Same
# mechanism as metathesis-deletion-restores-segment-between-switches. When #649 is fixed and the reference commit includes it, flip the
# six rows to the intended answers in status.yaml and delete their status.yaml rows.
language: MetathesisSwapThenGap
inspired_by: ["synthetic metathesis rule followed by a deletion that restores an optional node between the switches (not modeling any real language)"]
sources: ["sillsdev/PanGloss#411", "sillsdev/machine#649", "FieldWorks HCLoader.LoadMetathesisRule (the switches), HCLoader.LoadRewriteRule (t -> 0), HCLoader.LoadAffixProcessRule (prefix +, suffix a)"]
requires: [phonology]
words:
  - word: "+sp"
    note: >-
      Root pst: pm0 swaps `p s` to `s p`, and pd0 then deletes `t`; hc.dll generates `+sp` from NU0+R2 but cannot parse it, because analysis restores `t?` between the switches and pairs it with a switch. The reference gives no parse; status.yaml records the intended answer.
    expect_fail: true
    exercises:
      - "MetathesisRule > interaction with a rewrite rule"
  - word: "+spa"
    note: >-
      As +sp, with root tpsa (R0) or pst plus suffix SU1. The reference gives no parse; status.yaml records the intended answer.
    expect_fail: true
    exercises:
      - "MetathesisRule > interaction with a rewrite rule"
  - word: sp
    note: >-
      As +sp without the NU0 prefix. The reference gives no parse; status.yaml records the intended answer.
    expect_fail: true
    exercises:
      - "MetathesisRule > interaction with a rewrite rule"
  - word: spa
    note: >-
      As +spa without the NU0 prefix. The reference gives no parse; status.yaml records the intended answer.
    expect_fail: true
    exercises:
      - "MetathesisRule > interaction with a rewrite rule"
  - word: spaa
    note: >-
      Root tpsa plus suffix SU1 `a`. The reference gives no parse; status.yaml records the intended answer.
    expect_fail: true
    exercises:
      - "MetathesisRule > interaction with a rewrite rule"
  - word: "+spaa"
    note: >-
      As spaa with the NU0 prefix. The reference gives no parse; status.yaml records the intended answer.
    expect_fail: true
    exercises:
      - "MetathesisRule > interaction with a rewrite rule"
  - word: psa
    note: >-
      Control: root ptsa after pd0 deletes `t`; the letters already stand as p then s, so no swap is undone and nothing restored between switches changes the result. Both engines agree, so the six rejections above come from the swap-then-gap path alone. Removing pd0 (and the `t` of the roots) makes all six parse in C#.
    parses:
      - signature: "NU0+R1|+?psa"
        rules: [NU0, pd0, pm0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
      - signature: "R1|psa"
        rules: [pd0, pm0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
  - word: psaa
    note: >-
      Control with the suffix: root ptsa plus SU1 `a` after pd0 deletes `t`; again no swap is needed. The prefixed signature appears twice because the two unordered orders of NU0 and SU1 give separate derivations.
    parses:
      - signature: "NU0+R1+SU1|+?psaa"
        rules: [NU0, SU1, pd0, pm0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
      - signature: "NU0+R1+SU1|+?psaa"
        rules: [NU0, SU1, pd0, pm0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
      - signature: "R1+SU1|psaa"
        rules: [SU1, pd0, pm0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
