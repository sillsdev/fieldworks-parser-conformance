# oracle-provenance: founding-oracle machine-commit=ba6dfa10 verified-date=2026-11-26 (every row from the C# self-check at that pin, hc-conformance --propose; none from PanGloss; staged by PanGloss#411; the staged grammar's inverted switch order was converted to the producible one and every row replayed unchanged). The six expect_fail rows record that ba6dfa10 gives no parse for words its own synthesis generates.
# Known oracle limitation, sillsdev/machine#649 (open; divergence 132): analysis un-applies the deletion pd0 first and
# restores an optional t between the switches of pm0, so the optional t joins the first switch's capture and
# AnalysisMetathesisRuleSpec pairs the captures node by node: the swap is never undone and no root matches. Same
# mechanism as metathesis-deletion-restores-segment-between-switches. When #649 is fixed and a pin includes it, flip the
# six rows to the parses in their notes.
language: MetathesisSwapThenGap
inspired_by: ["synthetic metathesis rule followed by a deletion that restores an optional node between the switches (not modeling any real language)"]
sources: ["sillsdev/PanGloss#411", "sillsdev/machine#649", "FieldWorks HCLoader.LoadMetathesisRule (the switches), HCLoader.LoadRewriteRule (t -> 0), HCLoader.LoadAffixProcessRule (prefix +, suffix a)"]
requires: [phonology]
fieldworks_producible: true
words:
  - word: "+sp"
    note: >-
      Known oracle limitation (sillsdev/machine#649, open): machine ba6dfa10 gives no parse. Root pst: pm0 swaps `p s` to `s p`, and pd0 then deletes `t`; hc.dll generates `+sp` from NU0+R2 but cannot parse it, because analysis restores `t?` between the switches and pairs it with a switch. Intended parse once #649 is fixed: NU0+R2.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: "+spa"
    note: >-
      Known oracle limitation (sillsdev/machine#649, open): machine ba6dfa10 gives no parse. As +sp, with root tpsa (R0) or pst plus suffix SU1. Intended parse once #649 is fixed: NU0+R0 and NU0+R2+SU1.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: sp
    note: >-
      Known oracle limitation (sillsdev/machine#649, open): machine ba6dfa10 gives no parse. As +sp without the NU0 prefix. Intended parse once #649 is fixed: R2 (and NU0+R2, whose prefix is a bare boundary).
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: spa
    note: >-
      Known oracle limitation (sillsdev/machine#649, open): machine ba6dfa10 gives no parse. As +spa without the NU0 prefix. Intended parse once #649 is fixed: R0, R2+SU1 and the NU0 variants.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: spaa
    note: >-
      Known oracle limitation (sillsdev/machine#649, open): machine ba6dfa10 gives no parse. Root tpsa plus suffix SU1 `a`. Intended parse once #649 is fixed: R0+SU1.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: "+spaa"
    note: >-
      Known oracle limitation (sillsdev/machine#649, open): machine ba6dfa10 gives no parse. As spaa with the NU0 prefix. Intended parse once #649 is fixed: NU0+R0+SU1.
    expect_fail: true
    exercises: ["MetathesisRule"]
  - word: psa
    note: >-
      Control: root ptsa after pd0 deletes `t`; the letters already stand as p then s, so no swap is undone and nothing restored between switches changes the result. Both engines agree, so the six rejections above come from the swap-then-gap path alone. Removing pd0 (and the `t` of the roots) makes all six parse in C#.
    parses:
      - signature: "NU0+R1|+?psa"
        rules: [NU0, pd0, pm0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
      - signature: "R1|psa"
        rules: [pd0, pm0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
  - word: psaa
    note: >-
      Control with the suffix: root ptsa plus SU1 `a` after pd0 deletes `t`; again no swap is needed. The prefixed signature appears twice because the two unordered orders of NU0 and SU1 give separate derivations.
    parses:
      - signature: "NU0+R1+SU1|+?psaa"
        rules: [NU0, SU1, pd0, pm0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
      - signature: "NU0+R1+SU1|+?psaa"
        rules: [NU0, SU1, pd0, pm0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
      - signature: "R1+SU1|psaa"
        rules: [SU1, pd0, pm0]
        exercises: ["RewriteRule Iterative (epenthesis/deletion/feature/expansion/merge)"]
